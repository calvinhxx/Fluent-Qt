<!doctype html>
<html lang="en" data-site-language="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fluent-Qt — Page not found</title>
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#e3ebf2">
    <base href="/Fluent-Qt/">
    <script>
      if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
        document.querySelector("base").href = "/";
      }
    </script>
    <link rel="icon" href="assets/app-icon.png">
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("fluent-qt-theme");
          const theme = saved === "dark" || saved === "light"
            ? saved
            : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
          document.querySelector("meta[name='theme-color']").content = theme === "dark" ? "#070c12" : "#e3ebf2";
        } catch {
          document.documentElement.dataset.theme = "light";
        }
        const language = /\/zh-cn(?:\/|$)/i.test(location.pathname) ? "zh" : "en";
        document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
        document.documentElement.dataset.siteLanguage = language;
        document.title = language === "zh" ? "Fluent-Qt — 页面未找到" : "Fluent-Qt — Page not found";
      })();
    </script>
    <link rel="stylesheet" href="styles.css?v=20260820-3">
  </head>
  <body class="error-page">
    <main class="error-card">
      <p class="section-index">404 / NOT FOUND</p>
      <h1 data-lang-zh>在控件树里<br>走丢了。</h1>
      <h1 data-lang-en>This page<br>got lost.</h1>
      <p data-lang-zh>这个页面不存在，但 Fluent-Qt 项目还在原处。</p>
      <p data-lang-en>This page does not exist, but Fluent-Qt is still right where you left it.</p>
      <a class="button button-primary" href="zh-CN/" data-lang-zh>返回首页</a>
      <a class="button button-primary" href="./" data-lang-en>Back to home</a>
    </main>
  </body>
</html>
