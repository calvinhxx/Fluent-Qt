name: Bug report / 问题反馈
description: Report incorrect behavior, a crash, or a rendering problem. / 反馈功能、崩溃或显示问题。
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        **Using Gallery?** Click the Bug icon beside Settings, then choose **Open GitHub issue** in the success notification. Paste the copied ZIP into the attachment field below. The web Gallery downloads the ZIP instead.
        **使用 Gallery？** 点击 Settings 旁的 Bug 图标，待提示复制成功后点击 **Open GitHub issue**，再在下方粘贴诊断 ZIP；网页版请附上下载的 ZIP。
        Reports stay on your device until you attach them. Review logs and any crash files before sharing; issues and attachments are public.
  - type: textarea
    id: problem
    attributes:
      label: What happened? / 问题现象
      description: Describe what you expected and what happened instead. A screenshot or short recording helps with visual problems.
      placeholder: "Expected… / Actual…"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Give the Gallery page and actions, or a minimal code sample. If it happened once, say what you were doing.
      placeholder: |
        1. Open…
        2. Click…
  - type: textarea
    id: evidence
    attributes:
      label: Diagnostic report or screenshots / 诊断包或截图
      description: Paste or attach the ZIP from Gallery here. An environment summary or report ID alone does not upload the file. A report is optional; a minimal sample is also welcome.
  - type: input
    id: version
    attributes:
      label: FluentQt version or commit
      description: Auto-filled from Gallery. If no report is attached, enter the version here.
      placeholder: 1.11.3 or a commit
  - type: textarea
    id: environment
    attributes:
      label: Environment / 运行环境
      description: Auto-filled from Gallery. Otherwise include OS, architecture, Qt version, display scaling, and Python/PySide6 versions if applicable.
  - type: input
    id: install
    attributes:
      label: Build or install route / 安装方式
      placeholder: Gallery installer, PyPI wheel, vcpkg, or source build
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting / 提交前确认
      options:
        - label: I reviewed attachments and removed private data. / 已检查附件，不含不应公开的个人或业务信息。
          required: true
