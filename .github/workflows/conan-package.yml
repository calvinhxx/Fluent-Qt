name: Conan package

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'packaging/conan/**'
      - '.github/workflows/conan-package.yml'
      - '.github/scripts/install-linux-dependencies.sh'
  pull_request:
    paths:
      - 'packaging/conan/**'
      - '.github/workflows/conan-package.yml'
      - '.github/scripts/install-linux-dependencies.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conan-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer:
    name: ${{ matrix.os }} · Conan 2 · Release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            qt_arch: win64_msvc2022_64
            qt_archives: qtbase
          - os: ubuntu-24.04
            qt_arch: linux_gcc_64
            qt_archives: qtbase icu
    env:
      QT_VERSION: '6.9.3'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install Linux Qt runtime and build dependencies
        if: runner.os == 'Linux'
        run: bash .github/scripts/install-linux-dependencies.sh aqt

      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          archives: ${{ matrix.qt_archives }}
          setup-python: false
          cache: true

      - name: Install Conan and detect the native toolchain
        run: |
          python -m pip install conan==2.34.0
          conan profile detect

      - name: Package the latest recipe version and run the external consumer
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import Path

          import yaml
          from conan.tools.scm import Version

          recipe = Path("packaging/conan")
          sources = yaml.safe_load((recipe / "conandata.yml").read_text())["sources"]
          version = max(sources, key=Version)
          profile = Path(os.environ["RUNNER_TEMP"]) / "qt-sdk"
          profile.write_text(f"include(default)\n[platform_requires]\nqt/{os.environ['QT_VERSION']}\n")
          os.environ["CMAKE_PREFIX_PATH"] = os.environ["QT_ROOT_DIR"]
          subprocess.run([
              "conan", "create", str(recipe), f"--version={version}",
              "-pr:h", str(profile), "-pr:b", "default", "-s:h", "compiler.cppstd=17",
              "-s:h", "build_type=Release", "-c:h", "tools.build:jobs=4",
              "--no-remote", "--build=missing",
          ], check=True)
