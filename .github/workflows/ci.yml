name: CI
run-name: CI ${{ (github.event_name == 'schedule' || github.event_name == 'push') && 'full' || github.event.inputs.matrix || 'fast' }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      matrix:
        description: Validation tier to run.
        required: true
        default: fast
        type: choice
        options:
          - fast
          - full
      python_release_bundle:
        description: Build every publishable PySide6 wheel (full tier only).
        required: true
        default: false
        type: boolean
  schedule:
    # Weekly full validation matrix. Times are UTC.
    - cron: "23 18 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  plan:
    name: Plan validation
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      python_release_bundle: ${{ steps.mode.outputs.python_release_bundle }}
      run_macos_release_validation: ${{ steps.mode.outputs.run_macos_release_validation }}
      should_build: ${{ steps.changes.outputs.should_build }}
      should_build_pyside: ${{ steps.changes.outputs.should_build_pyside }}
      should_build_wasm: ${{ steps.changes.outputs.should_build_wasm }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate CI orchestration contracts
        shell: bash
        run: |
          python3 .github/scripts/test_classify_ci_changes.py
          python3 .github/scripts/test_check_release_branch_freshness.py
          python3 .github/scripts/validate-ci-workflow-boundaries.py
          python3 scripts/release/test_preflight.py
          python3 tools/ai/validate_ai_assets.py --project-root .
          python3 tools/onboarding/test_fluentqt_doctor.py
          python3 tools/onboarding/test_fluentqt_create.py
          python3 tools/onboarding/test_fluentqt_trial.py
          python3 -m unittest discover -s tools/dev -p 'test_fluent_qt_*.py'

      - name: Require a current main base for release pull requests
        if: >-
          ${{
            github.event_name == 'pull_request' &&
            github.base_ref == 'main' &&
            startsWith(github.head_ref, 'release/')
          }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          python3 .github/scripts/check-release-branch-freshness.py
          --repository "$GITHUB_REPOSITORY"
          --base-ref "${{ github.base_ref }}"
          --head-sha "${{ github.event.pull_request.head.sha }}"

      - name: Classify pull-request changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          should_build=true
          should_build_pyside=true
          should_build_wasm=true
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            changed_files="$(
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
                --jq '.[].filename'
            )"
            if [[ -z "$changed_files" ]]; then
              echo "::error::The pull request did not report any changed files."
              exit 1
            fi

            classification="$(
              python3 .github/scripts/classify_ci_changes.py \
                <<< "$changed_files"
            )"
            should_build="$(
              sed -n 's/^should_build=//p' <<< "$classification"
            )"
            should_build_pyside="$(
              sed -n 's/^should_build_pyside=//p' <<< "$classification"
            )"
            should_build_wasm="$(
              sed -n 's/^should_build_wasm=//p' <<< "$classification"
            )"
          fi

          for value in "$should_build" "$should_build_pyside" "$should_build_wasm"; do
            [[ "$value" == "true" || "$value" == "false" ]] || {
              echo "::error::Invalid CI change classification value: $value"
              exit 1
            }
          done
          if [[ "$should_build" == "false" && \
                ("$should_build_pyside" == "true" || "$should_build_wasm" == "true") ]]; then
            echo "::error::A specialized module cannot run when native validation is skipped."
            exit 1
          fi

          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "should_build_pyside=$should_build_pyside" >> "$GITHUB_OUTPUT"
          echo "should_build_wasm=$should_build_wasm" >> "$GITHUB_OUTPUT"
          if [[ "$should_build" == "true" ]]; then
            echo "The C++ validation module is required."
          else
            echo "Documentation-only pull request: skipping build validation."
          fi
          if [[ "$should_build_pyside" == "true" ]]; then
            echo "The PySide6 validation module is required."
          else
            echo "No binding-affecting files changed: skipping PySide6 validation."
          fi
          if [[ "$should_build_wasm" == "true" ]]; then
            echo "The WebAssembly validation module is required."
          else
            echo "No browser-affecting files changed: skipping WebAssembly validation."
          fi

      - name: Select validation tier
        id: mode
        shell: bash
        run: |
          set -euo pipefail

          mode="fast"
          python_release_bundle="false"
          run_macos_release_validation="true"
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            mode="full"
            python_release_bundle="true"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            mode="full"
            version="$(sed -nE 's/^[[:space:]]*project[[:space:]]*\([[:space:]]*FluentQt[[:space:]]+VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -n 1)"
            tag="v$version"
            git fetch --force --tags origin
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ &&
                  -f "docs/releases/$tag.md" ]] &&
               ! git rev-parse -q --verify "refs/tags/$tag^{tag}" >/dev/null; then
              run_macos_release_validation="false"
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mode="${{ github.event.inputs.matrix }}"
            python_release_bundle="${{ github.event.inputs.python_release_bundle }}"
          fi

          case "$mode" in
            fast|full) ;;
            *)
              echo "::error::Unsupported validation tier: $mode"
              exit 1
              ;;
          esac
          if [[ "$python_release_bundle" == "true" && "$mode" != "full" ]]; then
            echo "::error::The Python release bundle requires matrix=full."
            exit 1
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "python_release_bundle=$python_release_bundle" >> "$GITHUB_OUTPUT"
          echo "run_macos_release_validation=$run_macos_release_validation" >> "$GITHUB_OUTPUT"
          echo "Selected $mode validation (Python release bundle: $python_release_bundle; macOS release validation: $run_macos_release_validation)."

  cpp:
    name: C++ validation
    needs: plan
    if: ${{ needs.plan.outputs.should_build == 'true' }}
    uses: ./.github/workflows/ci-cpp.yml
    with:
      mode: ${{ needs.plan.outputs.mode }}

  python:
    name: PySide6 validation
    needs: plan
    if: ${{ needs.plan.outputs.should_build_pyside == 'true' }}
    uses: ./.github/workflows/ci-python.yml
    with:
      mode: ${{ needs.plan.outputs.mode }}
      build_release_bundle: ${{ needs.plan.outputs.python_release_bundle == 'true' }}
      run_compatibility_validation: true
      run_macos_release_validation: ${{ needs.plan.outputs.run_macos_release_validation == 'true' }}
      release_max_parallel: 4

  wasm:
    name: WebAssembly validation
    needs: plan
    if: ${{ needs.plan.outputs.should_build_wasm == 'true' }}
    uses: ./.github/workflows/ci-wasm.yml
    with:
      mode: ${{ needs.plan.outputs.mode }}

  pages:
    name: Deploy validated WebAssembly Gallery
    needs: [plan, wasm]
    if: ${{ github.event_name == 'push' && needs.wasm.result == 'success' }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  ci-gate:
    name: CI Gate
    needs: [plan, cpp, python, wasm]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required validation
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CPP_RESULT: ${{ needs.cpp.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          WASM_RESULT: ${{ needs.wasm.result }}
          SHOULD_BUILD: ${{ needs.plan.outputs.should_build }}
          SHOULD_BUILD_PYSIDE: ${{ needs.plan.outputs.should_build_pyside }}
          SHOULD_BUILD_WASM: ${{ needs.plan.outputs.should_build_wasm }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$PLAN_RESULT" != "success" ]]; then
            echo "::error::CI planning finished with result: $PLAN_RESULT"
            exit 1
          fi
          if [[ "$SHOULD_BUILD" == "true" && "$CPP_RESULT" != "success" ]]; then
            echo "::error::The C++ validation module finished with result: $CPP_RESULT"
            exit 1
          fi
          if [[ "$SHOULD_BUILD" != "true" && "$CPP_RESULT" != "skipped" ]]; then
            echo "::error::C++ validation should have been skipped, got: $CPP_RESULT"
            exit 1
          fi
          if [[ "$SHOULD_BUILD_PYSIDE" == "true" && "$PYTHON_RESULT" != "success" ]]; then
            echo "::error::The PySide6 validation module finished with result: $PYTHON_RESULT"
            exit 1
          fi
          if [[ "$SHOULD_BUILD_PYSIDE" != "true" && "$PYTHON_RESULT" != "skipped" ]]; then
            echo "::error::PySide6 validation should have been skipped, got: $PYTHON_RESULT"
            exit 1
          fi
          if [[ "$SHOULD_BUILD_WASM" == "true" && "$WASM_RESULT" != "success" ]]; then
            echo "::error::The WebAssembly validation module finished with result: $WASM_RESULT"
            exit 1
          fi
          if [[ "$SHOULD_BUILD_WASM" != "true" && "$WASM_RESULT" != "skipped" ]]; then
            echo "::error::WebAssembly validation should have been skipped, got: $WASM_RESULT"
            exit 1
          fi

          echo "Required CI validation passed."

  release-ready:
    name: Release ready
    needs: [plan, ci-gate]
    if: ${{ always() && needs.plan.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify full validation
        env:
          CI_GATE_RESULT: ${{ needs.ci-gate.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CI_GATE_RESULT" != "success" ]]; then
            echo "::error::The full CI gate finished with result: $CI_GATE_RESULT"
            exit 1
          fi
          echo "The full modular validation matrix passed."
