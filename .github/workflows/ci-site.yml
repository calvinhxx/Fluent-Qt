name: Website CI module

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Generate website and component documents
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      QT_VERSION: 6.9.3
      QT_QPA_PLATFORM: xcb
      QT_SCALE_FACTOR: "2"
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Generate documentation inputs
        run: python tools/site/build_site.py --prepare

      - name: Identify preview inputs
        id: preview-key
        run: |
          digest="$(python tools/site/build_site.py --preview-key)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Cache matching native previews
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: site/assets/component-previews
          key: fluentqt-site-previews-ubuntu24-qt${{ env.QT_VERSION }}-v1-${{ steps.preview-key.outputs.digest }}

      - name: Check preview freshness
        id: previews
        shell: bash
        run: |
          if python tools/site/generate_component_previews.py --check; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install native preview dependencies
        if: ${{ steps.previews.outputs.build == 'true' }}
        run: |
          bash .github/scripts/install-linux-dependencies.sh aqt
          sudo apt-get install -y --no-install-recommends libspdlog-dev ninja-build
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0"

      - name: Cache Qt native kit
        if: ${{ steps.previews.outputs.build == 'true' }}
        id: qt-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/Qt
          key: fluentqt-site-qt-${{ runner.os }}-${{ runner.arch }}-${{ env.QT_VERSION }}

      - name: Install Qt native kit
        if: ${{ steps.previews.outputs.build == 'true' && steps.qt-cache.outputs.cache-hit != 'true' }}
        run: python -m aqt install-qt -O "$RUNNER_TEMP/Qt" linux desktop "$QT_VERSION" linux_gcc_64

      - name: Build native Gallery for captures
        if: ${{ steps.previews.outputs.build == 'true' }}
        run: |
          cmake -S . -B build/site-native -G Ninja \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DFLUENT_QT_BUILD_TESTS=OFF -DFLUENT_QT_BUILD_EXAMPLES=OFF \
            -DFLUENT_QT_BUILD_GALLERY=ON -DFLUENT_QT_BUILD_SPATIAL=ON \
            -DFLUENT_QT_BUILD_QML_BRIDGE=ON
          cmake --build build/site-native --target fluent_qt_gallery --parallel 4

      - name: Capture real component previews
        if: ${{ steps.previews.outputs.build == 'true' }}
        run: |
          xvfb-run -a -s '-screen 0 3200x2400x24' \
            python tools/site/generate_component_previews.py \
            --executable build/site-native/app/fluent_qt_gallery

      - name: Generate and validate website
        run: |
          python tools/site/build_site.py --output build/site-pages --commit "$GITHUB_SHA"
          python tools/site/test_build_site.py
          python tools/site/test_site_assets.py
          python tools/site/test_generate_api_reference.py
          python tools/site/test_generate_localized_site.py
          node --test tools/site/test_hero_particles.mjs tools/site/test_spatial_showcase.mjs
          node --test tools/site/test_support.mjs

      - name: Upload generated website
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fluentqt-site-pages
          path: build/site-pages
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload capture diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fluentqt-site-capture-diagnostics-${{ github.run_attempt }}
          path: build/component-docs
          if-no-files-found: ignore
          retention-days: 7
