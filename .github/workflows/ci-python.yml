name: PySide6 CI module

on:
  workflow_call:
    inputs:
      mode:
        description: Validation tier selected by the CI orchestrator.
        required: true
        type: string
      build_release_bundle:
        description: Build the complete publishable wheel matrix and bundle.
        required: true
        type: boolean
      run_compatibility_validation:
        description: Run the legacy Linux and Windows compatibility lanes.
        required: false
        default: true
        type: boolean
      release_max_parallel:
        description: Maximum number of dynamic release-wheel jobs.
        required: false
        default: 4
        type: number

permissions:
  actions: read
  contents: read

jobs:
  plan:
    name: Plan PySide6 validation
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.matrix.outputs.mode }}
      pyside_release_matrix: ${{ steps.matrix.outputs.pyside_release_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate PySide6 catalogs and policies
        shell: bash
        run: |
          python3 .github/scripts/validate-pyside-wheel-matrix.py
          python3 .github/scripts/test_validate_pyside_wheel_matrix.py
          python3 .github/scripts/test_select_pyside_release_matrix.py
          python3 .github/scripts/test_assemble_pyside_release_bundle.py
          python3 .github/scripts/test_verify_python_package_index.py
          python3 .github/scripts/test_install_python_release_from_index.py
          python3 bindings/pyside6/tools/verify_api_policy.py
          python3 bindings/pyside6/tests/test_api_policy.py
          python3 bindings/pyside6/tests/test_manylinux_wheel.py
          python3 .github/scripts/validate-gallery-boundary.py

      - name: Select PySide6 release matrix
        id: matrix
        env:
          VALIDATION_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail

          case "$VALIDATION_MODE" in
            fast|full) ;;
            *)
              echo "::error::Unsupported PySide6 validation tier: $VALIDATION_MODE"
              exit 1
              ;;
          esac

          release_matrix="$(
            python3 .github/scripts/select-pyside-release-matrix.py
          )"

          echo "mode=$VALIDATION_MODE" >> "$GITHUB_OUTPUT"
          echo "pyside_release_matrix=$release_matrix" >> "$GITHUB_OUTPUT"
          if [[ "$VALIDATION_MODE" == "full" && \
                "${{ inputs.build_release_bundle }}" == "true" ]]; then
            echo "Selected $(jq '.include | length' <<< "$release_matrix") dynamic release scenarios."
            echo "Prioritized representative scenarios: $(
              jq -r \
                '[.include[] |
                  select(.extended_acceptance == true) |
                  .id] | join(", ")' \
                <<< "$release_matrix"
            )"
          elif [[ "$VALIDATION_MODE" == "full" ]]; then
            echo "Selected representative full validation; the optional Python release bundle is disabled."
          else
            echo "Fast validation selected; dynamic release scenarios will be skipped."
          fi

  pyside6_linux:
    name: PySide6 compatibility / Linux x64 / CPython 3.10 / Qt 6.2.4
    needs: plan
    if: ${{ inputs.run_compatibility_validation }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      VALIDATION_MODE: ${{ needs.plan.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux build tools
        shell: bash
        run: bash .github/scripts/install-linux-dependencies.sh aqt

      - name: Install Qt 6.2.4 SDK
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.2.4"
          arch: gcc_64
          cache: true

      - name: Install Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: bindings/pyside6/wheel-matrix.json

      - name: Install matching PySide6 and Shiboken6
        shell: bash
        run: |
          python -m pip install PySide6==6.2.4
          python -m pip install \
            --index-url https://download.qt.io/official_releases/QtForPython/ \
            shiboken6_generator==6.2.4

      - name: Install Shiboken 6.2 Clang headers
        shell: bash
        run: |
          set -euo pipefail
          clang_root="$(
            python .github/scripts/setup-shiboken-clang.py \
              --output "${RUNNER_TEMP}/shiboken-clang-10"
          )"
          test -f "$clang_root/lib/clang/10.0.0/include/stddef.h"
          echo "CLANG_INSTALL_DIR=$clang_root" >> "$GITHUB_ENV"

      - name: Configure PySide6 bindings
        shell: bash
        run: |
          gallery=OFF
          if [[ "$VALIDATION_MODE" == "full" ]]; then
            gallery=ON
          fi
          cmake -S . -B build/pyside6-qt62 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DPython_EXECUTABLE="$(command -v python)" \
            "-DFLUENT_QT_PYSIDE6_REQUIRES_PYTHON=>=3.10,<3.11" \
            -DFLUENT_QT_BUILD_PYSIDE6_BINDINGS=ON \
            -DFLUENT_QT_BUILD_PYSIDE6_GALLERY="$gallery" \
            -DFLUENT_QT_BUILD_EXAMPLES=OFF \
            -DFLUENT_QT_BUILD_GALLERY=OFF \
            -DFLUENT_QT_BUILD_TESTS=OFF \
            -DFLUENT_QT_INSTALL=OFF \
            -DBUILD_TESTING=ON

      - name: Build PySide6 bindings
        shell: bash
        run: cmake --build build/pyside6-qt62 --target fluentqt_pyside6_stubs --parallel 4

      - name: Verify generated binding contracts
        shell: bash
        run: |
          python bindings/pyside6/tools/verify_generated_contracts.py \
            --generated-dir \
            build/pyside6-qt62/bindings/pyside6/generated/_fluentqt

      - name: Verify PySide6 Qt runtime resolution
        shell: bash
        run: |
          set -euo pipefail

          module="$(
            find build/pyside6-qt62/python/fluentqt \
              -maxdepth 1 -type f -name '_fluentqt*.so' -print -quit
          )"
          if [[ -z "$module" ]]; then
            echo "::error::The FluentQt Python extension was not found."
            exit 1
          fi

          pyside_qt_lib="$(
            python -c \
              'from pathlib import Path; import PySide6; print((Path(PySide6.__file__).resolve().parent / "Qt" / "lib").resolve())'
          )"
          dependencies="$(env -u LD_LIBRARY_PATH ldd "$module")"
          printf '%s\n' "$dependencies"
          mapfile -t qt_paths < <(
            awk '$1 ~ /^libQt6(Core|Gui|Widgets)\.so/ {print $3}' \
              <<< "$dependencies"
          )
          if (( ${#qt_paths[@]} != 3 )); then
            echo "::error::Expected Core, Gui, and Widgets Qt dependencies."
            exit 1
          fi

          for qt_path in "${qt_paths[@]}"; do
            resolved_path="$(realpath "$qt_path")"
            case "$resolved_path" in
              "$pyside_qt_lib"/*) ;;
              *)
                echo "::error::Qt resolved outside PySide6: $resolved_path"
                exit 1
                ;;
            esac
          done

      - name: Test PySide6 bindings
        shell: bash
        run: |
          env \
            -u LD_LIBRARY_PATH \
            -u QT_PLUGIN_PATH \
            -u QT_QPA_PLATFORM_PLUGIN_PATH \
            ctest --test-dir build/pyside6-qt62 \
            -L '^pyside$' \
            --output-on-failure \
            --no-tests=error

      - name: Build relocatable PySide6 wheels
        shell: bash
        run: |
          cmake --build build/pyside6-qt62 \
            --target fluentqt_pyside6_wheels \
            --parallel 4

      - name: Test wheel in a clean virtual environment
        if: ${{ needs.plan.outputs.mode == 'full' }}
        shell: bash
        run: |
          set -euo pipefail

          wheel="$(
            find build/pyside6-qt62/wheelhouse \
              -maxdepth 1 -type f -name '*.whl' -print -quit
          )"
          if [[ -z "$wheel" ]]; then
            echo "::error::The FluentQt wheel was not generated."
            exit 1
          fi
          gallery_wheel="$(
            find build/pyside6-qt62/gallery-wheelhouse \
              -maxdepth 1 -type f -name '*.whl' -print -quit
          )"
          if [[ -z "$gallery_wheel" ]]; then
            echo "::error::The FluentQt Gallery wheel was not generated."
            exit 1
          fi

          clean_venv="${RUNNER_TEMP}/fluentqt-wheel-smoke"
          python -m venv "$clean_venv"
          "$clean_venv/bin/python" -m pip install "$wheel" "$gallery_wheel"
          wheel_version="$(
            "$clean_venv/bin/python" -c \
              'from importlib.metadata import version; print(version("FluentQt"))'
          )"

          env \
            -u PYTHONPATH \
            -u LD_LIBRARY_PATH \
            -u QT_PLUGIN_PATH \
            -u QT_QPA_PLATFORM_PLUGIN_PATH \
            QT_QPA_PLATFORM=offscreen \
            FLUENTQT_EXPECTED_VERSION="$wheel_version" \
            "$clean_venv/bin/python" \
            bindings/pyside6/tests/test_wheel_smoke.py
          env \
            -u PYTHONPATH \
            -u LD_LIBRARY_PATH \
            -u QT_PLUGIN_PATH \
            -u QT_QPA_PLATFORM_PLUGIN_PATH \
            QT_QPA_PLATFORM=offscreen \
            FLUENTQT_EXPECTED_VERSION="$wheel_version" \
            "$clean_venv/bin/python" \
            bindings/pyside6/gallery/tests/test_gallery_wheel_smoke.py
          "$clean_venv/bin/python" -m pip check
          "$clean_venv/bin/python" -m pip install mypy==2.3.0
          env -u PYTHONPATH \
            "$clean_venv/bin/python" -m mypy \
            --strict \
            --no-incremental \
            --no-error-summary \
            bindings/pyside6/tests/test_typecheck_smoke.py
          env \
            -u PYTHONPATH \
            -u LD_LIBRARY_PATH \
            -u QT_PLUGIN_PATH \
            -u QT_QPA_PLATFORM_PLUGIN_PATH \
            QT_QPA_PLATFORM=offscreen \
            "$clean_venv/bin/python" \
            bindings/pyside6/examples/compatibility_showcase.py \
            --snapshot "$RUNNER_TEMP/fluentqt-pyside6-showcase.png"
          env \
            -u PYTHONPATH \
            -u LD_LIBRARY_PATH \
            -u QT_PLUGIN_PATH \
            -u QT_QPA_PLATFORM_PLUGIN_PATH \
            QT_QPA_PLATFORM=offscreen \
            "$clean_venv/bin/python" \
            bindings/pyside6/examples/auto_suggest_box.py \
            --snapshot "$RUNNER_TEMP/fluentqt-pyside6-auto-suggest-box.png"
          env \
            -u PYTHONPATH \
            -u LD_LIBRARY_PATH \
            -u QT_PLUGIN_PATH \
            -u QT_QPA_PLATFORM_PLUGIN_PATH \
            QT_QPA_PLATFORM=offscreen \
            "$clean_venv/bin/python" \
            bindings/pyside6/examples/guidance_overlays.py \
            --snapshot "$RUNNER_TEMP/fluentqt-pyside6-guidance-overlays.png"
          env \
            -u PYTHONPATH \
            -u LD_LIBRARY_PATH \
            -u QT_PLUGIN_PATH \
            -u QT_QPA_PLATFORM_PLUGIN_PATH \
            QT_QPA_PLATFORM=offscreen \
            "$clean_venv/bin/python" \
            bindings/pyside6/examples/command_surfaces.py \
            --snapshot "$RUNNER_TEMP/fluentqt-pyside6-command-surfaces.png"

          module="$(
            env -u PYTHONPATH "$clean_venv/bin/python" -c \
              'import fluentqt._fluentqt as native; print(native.__file__)'
          )"
          dynamic_section="$(readelf -d "$module")"
          printf '%s\n' "$dynamic_section"
          grep -F '$ORIGIN/../PySide6' <<< "$dynamic_section"
          if grep -F "$GITHUB_WORKSPACE" <<< "$dynamic_section"; then
            echo "::error::Installed wheel retained a build-tree RPATH."
            exit 1
          fi

          dependencies="$(env -u LD_LIBRARY_PATH ldd "$module")"
          printf '%s\n' "$dependencies"
          mapfile -t runtime_paths < <(
            awk \
              '$1 ~ /^(libQt6(Core|Gui|Widgets)\.so|libpyside6|libshiboken6)/ {print $3}' \
              <<< "$dependencies"
          )
          if (( ${#runtime_paths[@]} < 5 )); then
            echo "::error::Expected Qt, PySide6, and Shiboken6 dependencies."
            exit 1
          fi
          for runtime_path in "${runtime_paths[@]}"; do
            resolved_path="$(realpath "$runtime_path")"
            case "$resolved_path" in
              "$clean_venv"/*) ;;
              *)
                echo "::error::Wheel dependency resolved outside the clean venv: $resolved_path"
                exit 1
                ;;
            esac
          done

      - name: Test core wheel in a clean virtual environment (fast)
        if: ${{ needs.plan.outputs.mode != 'full' }}
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(
            find build/pyside6-qt62/wheelhouse \
              -maxdepth 1 -type f -name '*.whl' -print -quit
          )"
          if [[ -z "$wheel" ]]; then
            echo "::error::The FluentQt wheel was not generated."
            exit 1
          fi

          clean_venv="${RUNNER_TEMP}/fluentqt-core-wheel-smoke"
          python -m venv "$clean_venv"
          "$clean_venv/bin/python" -m pip install "$wheel"
          wheel_version="$(
            "$clean_venv/bin/python" -c \
              'from importlib.metadata import version; print(version("FluentQt"))'
          )"
          env \
            -u PYTHONPATH \
            -u LD_LIBRARY_PATH \
            -u QT_PLUGIN_PATH \
            -u QT_QPA_PLATFORM_PLUGIN_PATH \
            QT_QPA_PLATFORM=offscreen \
            FLUENTQT_EXPECTED_VERSION="$wheel_version" \
            "$clean_venv/bin/python" \
            bindings/pyside6/tests/test_wheel_smoke.py
          "$clean_venv/bin/python" -m pip check

      - name: Verify native X11 Window and TitleBar
        if: ${{ needs.plan.outputs.mode == 'full' }}
        shell: bash
        run: |
          set -euo pipefail
          clean_venv="${RUNNER_TEMP}/fluentqt-wheel-smoke"
          xvfb-run -a env \
            -u PYTHONPATH \
            -u LD_LIBRARY_PATH \
            -u QT_PLUGIN_PATH \
            -u QT_QPA_PLATFORM_PLUGIN_PATH \
            QT_QPA_PLATFORM=xcb \
            "$clean_venv/bin/python" \
            bindings/pyside6/examples/window_chrome.py \
            --verify-native \
            --snapshot "$RUNNER_TEMP/fluentqt-pyside6-window-chrome.png" \
            --report "$RUNNER_TEMP/fluentqt-pyside6-window-chrome.json"

      - name: Upload PySide6 wheel
        uses: actions/upload-artifact@v4
        with:
          name: fluentqt-pyside6-qt624-cp310-linux-x64
          path: |
            build/pyside6-qt62/wheelhouse/*.whl
            build/pyside6-qt62/gallery-wheelhouse/*.whl
          if-no-files-found: error

      - name: Upload PySide6 acceptance snapshot
        if: ${{ needs.plan.outputs.mode == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: fluentqt-pyside6-showcase-qt624-cp310-linux-x64
          path: ${{ runner.temp }}/fluentqt-pyside6-showcase.png
          if-no-files-found: error

      - name: Upload PySide6 native window acceptance
        if: ${{ needs.plan.outputs.mode == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: fluentqt-pyside6-window-chrome-qt624-cp310-linux-x64
          path: |
            ${{ runner.temp }}/fluentqt-pyside6-window-chrome.png
            ${{ runner.temp }}/fluentqt-pyside6-window-chrome.json
          if-no-files-found: error

      - name: Record Linux PySide6 first-window trial
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.plan.outputs.mode }}" == "full" ]]; then
            clean_venv="${RUNNER_TEMP}/fluentqt-wheel-smoke"
          else
            clean_venv="${RUNNER_TEMP}/fluentqt-core-wheel-smoke"
          fi
          env \
            -u PYTHONPATH \
            -u LD_LIBRARY_PATH \
            -u QT_PLUGIN_PATH \
            -u QT_QPA_PLATFORM_PLUGIN_PATH \
            QT_QPA_PLATFORM=offscreen \
            "$clean_venv/bin/python" tools/onboarding/fluentqt trial \
            --profile python \
            --starter workbench \
            --timeout-seconds 300 \
            --output "$RUNNER_TEMP/fluentqt-first-window-python-linux.json"

      - name: Upload Linux PySide6 first-window report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fluentqt-first-window-python-${{ needs.plan.outputs.mode }}-linux-x64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fluentqt-first-window-python-linux.json
          if-no-files-found: warn
          retention-days: 14

  pyside6_windows:
    name: PySide6 compatibility / Windows x64 / CPython 3.10 / Qt 6.2.4
    needs: plan
    if: ${{ inputs.run_compatibility_validation }}
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      VALIDATION_MODE: ${{ needs.plan.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: bindings/pyside6/wheel-matrix.json

      - name: Install Qt 6.2.4 SDK
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.2.4"
          arch: win64_msvc2019_64
          cache: true
          setup-python: false

      - name: Install matching PySide6 and Shiboken6
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install PySide6==6.2.4
          python -m pip install --index-url https://download.qt.io/official_releases/QtForPython/ shiboken6_generator==6.2.4

      - name: Configure Shiboken 6.2 toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          $clangOutput = Join-Path $env:RUNNER_TEMP "shiboken-clang-10"
          $clangRoot = python .github/scripts/setup-shiboken-clang.py `
            --output $clangOutput
          $clangRoot = $clangRoot.Trim()
          $clangStddef = Join-Path $clangRoot "lib/clang/10.0.0/include/stddef.h"
          if (!(Test-Path $clangStddef -PathType Leaf)) {
            throw "Clang 10 builtin headers were not installed at $clangRoot."
          }
          "CLANG_INSTALL_DIR=$clangRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio/Installer/vswhere.exe"
          $vsRoot = (
            & $vswhere `
              -latest `
              -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath
          ).Trim()
          if (!$vsRoot) {
            throw "Visual Studio with the C++ toolchain was not found."
          }

          $toolsets = Join-Path $vsRoot "VC/Tools/MSVC"
          $v142 = Get-ChildItem -Path $toolsets -Directory |
            Where-Object { $_.Name -like "14.29.*" } |
            Sort-Object -Property Name -Descending |
            Select-Object -First 1
          if (!$v142) {
            throw "The MSVC v142 (14.29) toolset was not found in $toolsets."
          }
          if (!(Test-Path (Join-Path $v142.FullName "include/variant") -PathType Leaf)) {
            throw "The MSVC v142 standard library is incomplete: $($v142.FullName)."
          }

          $vcInstallDir = Join-Path $vsRoot "VC"
          "VCToolsInstallDir=$($v142.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCINSTALLDIR=$vcInstallDir" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using Clang headers from $clangRoot"
          Write-Host "Using MSVC toolset $($v142.Name)"

      - name: Configure PySide6 bindings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $qtRoot = $env:QT_ROOT_DIR -replace '\\', '/'
          $python = (Get-Command python).Source -replace '\\', '/'
          $gallery = if ($env:VALIDATION_MODE -eq "full") { "ON" } else { "OFF" }
          $configureArgs = @(
            "-S", ".",
            "-B", "build/pyside6-qt62-windows",
            "-G", "Visual Studio 17 2022",
            "-A", "x64",
            "-T", "v142",
            "-DCMAKE_PREFIX_PATH=$qtRoot",
            "-DPython_EXECUTABLE=$python",
            "-DFLUENT_QT_PYSIDE6_REQUIRES_PYTHON=>=3.10,<3.11",
            "-DFLUENT_QT_BUILD_PYSIDE6_BINDINGS=ON",
            "-DFLUENT_QT_BUILD_PYSIDE6_GALLERY=$gallery",
            "-DFLUENT_QT_BUILD_EXAMPLES=OFF",
            "-DFLUENT_QT_BUILD_GALLERY=OFF",
            "-DFLUENT_QT_BUILD_TESTS=OFF",
            "-DFLUENT_QT_INSTALL=OFF",
            "-DBUILD_TESTING=ON"
          )
          cmake @configureArgs

      - name: Build PySide6 bindings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --build build/pyside6-qt62-windows `
            --config Release `
            --target fluentqt_pyside6_stubs `
            --parallel

      - name: Verify generated binding contracts
        shell: pwsh
        run: |
          python bindings/pyside6/tools/verify_generated_contracts.py `
            --generated-dir `
            build/pyside6-qt62-windows/bindings/pyside6/generated/_fluentqt

      - name: Test PySide6 bindings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          ctest --test-dir build/pyside6-qt62-windows `
            -C Release `
            -L '^pyside$' `
            --output-on-failure `
            --no-tests=error

      - name: Build relocatable PySide6 wheels
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --build build/pyside6-qt62-windows `
            --config Release `
            --target fluentqt_pyside6_wheels `
            --parallel

      - name: Test wheel in a clean virtual environment
        if: ${{ needs.plan.outputs.mode == 'full' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          $wheels = @(
            Get-ChildItem `
              -Path build/pyside6-qt62-windows/wheelhouse `
              -Filter '*.whl' `
              -File
          )
          if ($wheels.Count -ne 1) {
            throw "Expected one FluentQt wheel, found $($wheels.Count)."
          }
          $wheel = $wheels[0]
          if ($wheel.Name -notmatch '-cp310-cp310-win_amd64\.whl$') {
            throw "Unexpected Windows wheel tag: $($wheel.Name)"
          }
          $galleryWheels = @(
            Get-ChildItem `
              -Path build/pyside6-qt62-windows/gallery-wheelhouse `
              -Filter '*.whl' `
              -File
          )
          if ($galleryWheels.Count -ne 1) {
            throw "Expected one FluentQt Gallery wheel, found $($galleryWheels.Count)."
          }
          $galleryWheel = $galleryWheels[0]
          if ($galleryWheel.Name -notmatch '-py3-none-any\.whl$') {
            throw "Unexpected Gallery wheel tag: $($galleryWheel.Name)"
          }

          $cleanVenv = Join-Path $env:RUNNER_TEMP "fluentqt-wheel-smoke-windows"
          python -m venv $cleanVenv
          $cleanPython = Join-Path $cleanVenv "Scripts/python.exe"
          & $cleanPython -m pip install $wheel.FullName $galleryWheel.FullName
          $wheelVersion = & $cleanPython -c 'from importlib.metadata import version; print(version("FluentQt"))'

          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:FLUENTQT_EXPECTED_VERSION = $wheelVersion.Trim()
          & $cleanPython bindings/pyside6/tests/test_wheel_smoke.py
          & $cleanPython bindings/pyside6/gallery/tests/test_gallery_wheel_smoke.py
          & $cleanPython -m pip check

      - name: Run extended compatibility acceptance
        if: ${{ needs.plan.outputs.mode == 'full' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $cleanPython = Join-Path `
            $env:RUNNER_TEMP `
            "fluentqt-wheel-smoke-windows/Scripts/python.exe"
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          Remove-Item Env:LD_LIBRARY_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:DYLD_LIBRARY_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = "offscreen"
          & $cleanPython -m pip install mypy==2.3.0
          & $cleanPython -m mypy `
            --strict `
            --no-incremental `
            --no-error-summary `
            bindings/pyside6/tests/test_typecheck_smoke.py
          $snapshot = Join-Path `
            $env:RUNNER_TEMP `
            "fluentqt-pyside6-showcase.png"
          & $cleanPython `
            bindings/pyside6/examples/compatibility_showcase.py `
            --snapshot $snapshot
          $autoSuggestSnapshot = Join-Path `
            $env:RUNNER_TEMP `
            "fluentqt-pyside6-auto-suggest-box.png"
          & $cleanPython `
            bindings/pyside6/examples/auto_suggest_box.py `
            --snapshot $autoSuggestSnapshot
          $guidanceSnapshot = Join-Path `
            $env:RUNNER_TEMP `
            "fluentqt-pyside6-guidance-overlays.png"
          & $cleanPython `
            bindings/pyside6/examples/guidance_overlays.py `
            --snapshot $guidanceSnapshot
          $commandSurfacesSnapshot = Join-Path `
            $env:RUNNER_TEMP `
            "fluentqt-pyside6-command-surfaces.png"
          & $cleanPython `
            bindings/pyside6/examples/command_surfaces.py `
            --snapshot $commandSurfacesSnapshot

      - name: Test core wheel in a clean virtual environment (fast)
        if: ${{ needs.plan.outputs.mode != 'full' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $wheels = @(
            Get-ChildItem `
              -Path build/pyside6-qt62-windows/wheelhouse `
              -Filter '*.whl' `
              -File
          )
          if ($wheels.Count -ne 1) {
            throw "Expected one FluentQt wheel, found $($wheels.Count)."
          }

          $cleanVenv = Join-Path $env:RUNNER_TEMP "fluentqt-core-wheel-smoke"
          python -m venv $cleanVenv
          $cleanPython = Join-Path $cleanVenv "Scripts/python.exe"
          & $cleanPython -m pip install $wheels[0].FullName
          $wheelVersion = & $cleanPython -c 'from importlib.metadata import version; print(version("FluentQt"))'
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:FLUENTQT_EXPECTED_VERSION = $wheelVersion.Trim()
          & $cleanPython bindings/pyside6/tests/test_wheel_smoke.py
          & $cleanPython -m pip check

      - name: Verify native Windows Window and TitleBar
        if: ${{ needs.plan.outputs.mode == 'full' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $cleanVenv = Join-Path $env:RUNNER_TEMP "fluentqt-wheel-smoke-windows"
          $cleanPython = Join-Path $cleanVenv "Scripts/python.exe"
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = "windows"
          & $cleanPython `
            bindings/pyside6/examples/window_chrome.py `
            --verify-native `
            --snapshot (Join-Path $env:RUNNER_TEMP "fluentqt-pyside6-window-chrome.png") `
            --report (Join-Path $env:RUNNER_TEMP "fluentqt-pyside6-window-chrome.json")

      - name: Upload PySide6 wheel
        uses: actions/upload-artifact@v4
        with:
          name: fluentqt-pyside6-qt624-cp310-windows-x64
          path: |
            build/pyside6-qt62-windows/wheelhouse/*.whl
            build/pyside6-qt62-windows/gallery-wheelhouse/*.whl
          if-no-files-found: error

      - name: Upload PySide6 acceptance snapshot
        if: ${{ needs.plan.outputs.mode == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: fluentqt-pyside6-showcase-qt624-cp310-windows-x64
          path: ${{ runner.temp }}/fluentqt-pyside6-showcase.png
          if-no-files-found: error

      - name: Upload PySide6 native window acceptance
        if: ${{ needs.plan.outputs.mode == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: fluentqt-pyside6-window-chrome-qt624-cp310-windows-x64
          path: |
            ${{ runner.temp }}/fluentqt-pyside6-window-chrome.png
            ${{ runner.temp }}/fluentqt-pyside6-window-chrome.json
          if-no-files-found: error

      - name: Record Windows PySide6 first-window trial
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          if ("${{ needs.plan.outputs.mode }}" -eq "full") {
            $cleanVenv = Join-Path `
              $env:RUNNER_TEMP `
              "fluentqt-wheel-smoke-windows"
          } else {
            $cleanVenv = Join-Path `
              $env:RUNNER_TEMP `
              "fluentqt-core-wheel-smoke"
          }
          $cleanPython = Join-Path $cleanVenv "Scripts/python.exe"
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          Remove-Item Env:LD_LIBRARY_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:DYLD_LIBRARY_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = "offscreen"
          & $cleanPython tools/onboarding/fluentqt trial `
            --profile python `
            --starter workbench `
            --timeout-seconds 300 `
            --output (Join-Path $env:RUNNER_TEMP "fluentqt-first-window-python-windows.json")

      - name: Upload Windows PySide6 first-window report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fluentqt-first-window-python-${{ needs.plan.outputs.mode }}-windows-x64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fluentqt-first-window-python-windows.json
          if-no-files-found: warn
          retention-days: 14

  pyside6_macos:
    name: PySide6 release / macOS ARM64 / CPython 3.11 / Qt 6.9.3
    needs: plan
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bindings/pyside6/wheel-matrix.json

      - name: Install Qt 6.9.3 SDK
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.3"
          arch: clang_64
          cache: true
          setup-python: false

      - name: Install matching PySide6 and Shiboken6
        shell: bash
        run: |
          python -m pip install PySide6==6.9.3
          python -m pip install \
            --index-url https://download.qt.io/official_releases/QtForPython/ \
            shiboken6_generator==6.9.3

      - name: Configure PySide6 bindings
        shell: bash
        run: |
          cmake -S . -B build/pyside6-qt69-macos \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DPython_EXECUTABLE="$(command -v python)" \
            "-DFLUENT_QT_PYSIDE6_REQUIRES_PYTHON=>=3.11,<3.14" \
            -DFLUENT_QT_BUILD_PYSIDE6_BINDINGS=ON \
            -DFLUENT_QT_BUILD_PYSIDE6_GALLERY=ON \
            -DFLUENT_QT_BUILD_EXAMPLES=OFF \
            -DFLUENT_QT_BUILD_GALLERY=OFF \
            -DFLUENT_QT_BUILD_TESTS=OFF \
            -DFLUENT_QT_INSTALL=OFF \
            -DBUILD_TESTING=ON

      - name: Build PySide6 bindings
        shell: bash
        run: |
          cmake --build build/pyside6-qt69-macos \
            --target fluentqt_pyside6_stubs \
            --parallel 3

      - name: Verify generated binding contracts
        shell: bash
        run: |
          python bindings/pyside6/tools/verify_generated_contracts.py \
            --generated-dir \
            build/pyside6-qt69-macos/bindings/pyside6/generated/_fluentqt \
            --check-backdrop-converter

      - name: Test PySide6 bindings
        shell: bash
        run: |
          env \
            -u DYLD_LIBRARY_PATH \
            -u QT_PLUGIN_PATH \
            -u QT_QPA_PLATFORM_PLUGIN_PATH \
            ctest --test-dir build/pyside6-qt69-macos \
            -L '^pyside$' \
            --output-on-failure \
            --no-tests=error

      - name: Build relocatable PySide6 wheels
        shell: bash
        run: |
          cmake --build build/pyside6-qt69-macos \
            --target fluentqt_pyside6_wheels \
            --parallel 3

      - name: Test wheel in a clean virtual environment
        shell: bash
        run: |
          set -euo pipefail

          wheel="$(
            find build/pyside6-qt69-macos/wheelhouse \
              -maxdepth 1 -type f -name '*.whl' -print -quit
          )"
          if [[ -z "$wheel" ]]; then
            echo "::error::The FluentQt wheel was not generated."
            exit 1
          fi
          gallery_wheel="$(
            find build/pyside6-qt69-macos/gallery-wheelhouse \
              -maxdepth 1 -type f -name '*.whl' -print -quit
          )"
          if [[ -z "$gallery_wheel" ]]; then
            echo "::error::The FluentQt Gallery wheel was not generated."
            exit 1
          fi
          case "$(basename "$wheel")" in
            *-cp311-cp311-macosx_12_0_arm64.whl) ;;
            *)
              echo "::error::Unexpected macOS wheel tag: $(basename "$wheel")"
              exit 1
              ;;
          esac

          clean_venv="${RUNNER_TEMP}/fluentqt-wheel-smoke-macos"
          python -m venv "$clean_venv"
          "$clean_venv/bin/python" -m pip install "$wheel" "$gallery_wheel"
          wheel_version="$(
            "$clean_venv/bin/python" -c \
              'from importlib.metadata import version; print(version("FluentQt"))'
          )"

          env \
            -u PYTHONPATH \
            -u DYLD_LIBRARY_PATH \
            -u QT_PLUGIN_PATH \
            -u QT_QPA_PLATFORM_PLUGIN_PATH \
            QT_QPA_PLATFORM=offscreen \
            FLUENTQT_EXPECTED_VERSION="$wheel_version" \
            "$clean_venv/bin/python" \
            bindings/pyside6/tests/test_wheel_smoke.py
          env \
            -u PYTHONPATH \
            -u DYLD_LIBRARY_PATH \
            -u QT_PLUGIN_PATH \
            -u QT_QPA_PLATFORM_PLUGIN_PATH \
            QT_QPA_PLATFORM=offscreen \
            FLUENTQT_EXPECTED_VERSION="$wheel_version" \
            "$clean_venv/bin/python" \
            bindings/pyside6/gallery/tests/test_gallery_wheel_smoke.py
          "$clean_venv/bin/python" -m pip check
          "$clean_venv/bin/python" -m pip install mypy==2.3.0
          env -u PYTHONPATH \
            "$clean_venv/bin/python" -m mypy \
            --strict \
            --no-incremental \
            --no-error-summary \
            bindings/pyside6/tests/test_typecheck_smoke.py
          env \
            -u PYTHONPATH \
            -u DYLD_LIBRARY_PATH \
            -u QT_PLUGIN_PATH \
            -u QT_QPA_PLATFORM_PLUGIN_PATH \
            QT_QPA_PLATFORM=offscreen \
            "$clean_venv/bin/python" \
            bindings/pyside6/examples/compatibility_showcase.py \
            --snapshot "$RUNNER_TEMP/fluentqt-pyside6-showcase.png"
          env \
            -u PYTHONPATH \
            -u DYLD_LIBRARY_PATH \
            -u QT_PLUGIN_PATH \
            -u QT_QPA_PLATFORM_PLUGIN_PATH \
            QT_QPA_PLATFORM=offscreen \
            "$clean_venv/bin/python" \
            bindings/pyside6/examples/auto_suggest_box.py \
            --snapshot "$RUNNER_TEMP/fluentqt-pyside6-auto-suggest-box.png"
          env \
            -u PYTHONPATH \
            -u DYLD_LIBRARY_PATH \
            -u QT_PLUGIN_PATH \
            -u QT_QPA_PLATFORM_PLUGIN_PATH \
            QT_QPA_PLATFORM=offscreen \
            "$clean_venv/bin/python" \
            bindings/pyside6/examples/guidance_overlays.py \
            --snapshot "$RUNNER_TEMP/fluentqt-pyside6-guidance-overlays.png"
          env \
            -u PYTHONPATH \
            -u DYLD_LIBRARY_PATH \
            -u QT_PLUGIN_PATH \
            -u QT_QPA_PLATFORM_PLUGIN_PATH \
            QT_QPA_PLATFORM=offscreen \
            "$clean_venv/bin/python" \
            bindings/pyside6/examples/command_surfaces.py \
            --snapshot "$RUNNER_TEMP/fluentqt-pyside6-command-surfaces.png"

          module="$(
            env -u PYTHONPATH "$clean_venv/bin/python" -c \
              'import fluentqt._fluentqt as native; print(native.__file__)'
          )"
          rpaths="$(
            otool -l "$module" \
              | awk '/cmd LC_RPATH/ {getline; getline; print $2}'
          )"
          printf '%s\n' "$rpaths"
          grep -Fx '@loader_path/../PySide6' <<< "$rpaths"
          grep -Fx '@loader_path/../shiboken6' <<< "$rpaths"
          grep -Fx '@loader_path/../PySide6/Qt/lib' <<< "$rpaths"
          if grep -E '^/' <<< "$rpaths"; then
            echo "::error::Installed wheel retained an absolute RPATH."
            exit 1
          fi

          dependencies="$(otool -L "$module")"
          printf '%s\n' "$dependencies"
          architecture="$(lipo -archs "$module")"
          if [[ "$architecture" != "arm64" ]]; then
            echo "::error::Expected an arm64 extension, found: $architecture"
            exit 1
          fi
          deployment_target="$(
            otool -l "$module" \
              | awk '
                  /cmd LC_BUILD_VERSION/ { in_build_version = 1; next }
                  in_build_version && $1 == "minos" { print $2; exit }
                '
          )"
          if [[ "$deployment_target" != "12.0" ]]; then
            echo "::error::Expected macOS deployment target 12.0, found: $deployment_target"
            exit 1
          fi

      - name: Verify native Cocoa Window and TitleBar
        shell: bash
        run: |
          set -euo pipefail
          clean_venv="${RUNNER_TEMP}/fluentqt-wheel-smoke-macos"
          env \
            -u PYTHONPATH \
            -u DYLD_LIBRARY_PATH \
            -u QT_PLUGIN_PATH \
            -u QT_QPA_PLATFORM_PLUGIN_PATH \
            QT_QPA_PLATFORM=cocoa \
            "$clean_venv/bin/python" \
            bindings/pyside6/examples/window_chrome.py \
            --verify-native \
            --snapshot "$RUNNER_TEMP/fluentqt-pyside6-window-chrome.png" \
            --report "$RUNNER_TEMP/fluentqt-pyside6-window-chrome.json"

      - name: Upload PySide6 wheel
        uses: actions/upload-artifact@v4
        with:
          name: fluentqt-pyside6-qt693-cp311-macos-arm64
          path: |
            build/pyside6-qt69-macos/wheelhouse/*.whl
            build/pyside6-qt69-macos/gallery-wheelhouse/*.whl
          if-no-files-found: error

      - name: Upload PySide6 acceptance snapshot
        uses: actions/upload-artifact@v4
        with:
          name: fluentqt-pyside6-showcase-qt693-cp311-macos-arm64
          path: ${{ runner.temp }}/fluentqt-pyside6-showcase.png
          if-no-files-found: error

      - name: Upload PySide6 native window acceptance
        uses: actions/upload-artifact@v4
        with:
          name: fluentqt-pyside6-window-chrome-qt693-cp311-macos-arm64
          path: |
            ${{ runner.temp }}/fluentqt-pyside6-window-chrome.png
            ${{ runner.temp }}/fluentqt-pyside6-window-chrome.json
          if-no-files-found: error

      - name: Record macOS PySide6 first-window trial
        shell: bash
        run: |
          set -euo pipefail
          clean_venv="${RUNNER_TEMP}/fluentqt-wheel-smoke-macos"
          env \
            -u PYTHONPATH \
            -u DYLD_LIBRARY_PATH \
            -u QT_PLUGIN_PATH \
            -u QT_QPA_PLATFORM_PLUGIN_PATH \
            QT_QPA_PLATFORM=offscreen \
            "$clean_venv/bin/python" tools/onboarding/fluentqt trial \
            --profile python \
            --starter workbench \
            --timeout-seconds 300 \
            --output "$RUNNER_TEMP/fluentqt-first-window-python-macos.json"

      - name: Upload macOS PySide6 first-window report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fluentqt-first-window-python-${{ needs.plan.outputs.mode }}-macos-arm64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fluentqt-first-window-python-macos.json
          if-no-files-found: warn
          retention-days: 14

  pyside6_release:
    name: ${{ matrix.name }}
    needs: plan
    if: ${{ needs.plan.outputs.mode == 'full' && inputs.build_release_bundle }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      # Normal CI also runs two compatibility downloads and stays at four.
      # The candidate skips those duplicate lanes and may safely use six while
      # keeping the successful seven-job Qt setup peak (six plus macOS CPython
      # 3.11) observed in v1.7.2.
      max-parallel: ${{ inputs.release_max_parallel }}
      matrix: ${{ fromJson(needs.plan.outputs.pyside_release_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify native runner architecture
        shell: pwsh
        run: |
          if ("${{ runner.arch }}" -ne "${{ matrix.runner_arch }}") {
            throw "Expected runner architecture '${{ matrix.runner_arch }}', got '${{ runner.arch }}'."
          }

      - name: Install Linux build tools
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: bash .github/scripts/install-linux-dependencies.sh aqt

      - name: Install Python ${{ matrix.python_version }} ${{ matrix.arch }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: bindings/pyside6/wheel-matrix.json

      - name: Install Qt ${{ matrix.qt_version }} SDK
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}
          cache: true
          setup-python: false

      - name: Install matching PySide6 and Shiboken6
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install "PySide6-Essentials==${{ matrix.pyside_version }}"
          python -m pip install `
            --index-url https://download.qt.io/official_releases/QtForPython/ `
            "shiboken6_generator==${{ matrix.shiboken_version }}"

      - name: Install Clang 19 builtin headers for Shiboken
        if: >-
          ${{
            runner.os == 'Linux' ||
            (runner.os == 'Windows' && matrix.arch == 'arm64')
          }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $clangOutput = Join-Path $env:RUNNER_TEMP "shiboken-clang-19"
          $clangRoot = python .github/scripts/setup-shiboken-clang.py `
            --clang-major 19 `
            --output $clangOutput
          $clangRoot = $clangRoot.Trim()
          $clangArmTypes = Join-Path `
            $clangRoot `
            "lib/clang/19/include/arm_vector_types.h"
          if (!(Test-Path $clangArmTypes -PathType Leaf)) {
            throw "Clang 19 builtin headers were not installed at $clangRoot."
          }
          "CLANG_INSTALL_DIR=$clangRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using Clang 19 builtin headers from $clangRoot"

      - name: Configure PySide6 bindings on Unix
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          configure_args=(
            -S .
            -B "${{ matrix.build_dir }}"
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
            -DPython_EXECUTABLE="$(command -v python)"
            "-DFLUENT_QT_PYSIDE6_REQUIRES_PYTHON=${{ matrix.requires_python }}"
            -DFLUENT_QT_BUILD_PYSIDE6_BINDINGS=ON
            -DFLUENT_QT_BUILD_PYSIDE6_GALLERY=ON
            -DFLUENT_QT_BUILD_EXAMPLES=OFF
            -DFLUENT_QT_BUILD_GALLERY=OFF
            -DFLUENT_QT_BUILD_TESTS=OFF
            -DFLUENT_QT_INSTALL=OFF
            -DBUILD_TESTING=ON
          )
          if [[ -n "${{ matrix.macos_deployment_target }}" ]]; then
            configure_args+=(
              -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target }}
            )
          fi
          cmake "${configure_args[@]}"

      - name: Configure PySide6 bindings on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $qtRoot = $env:QT_ROOT_DIR -replace '\\', '/'
          $python = (Get-Command python).Source -replace '\\', '/'
          $configureArgs = @(
            "-S", ".",
            "-B", "${{ matrix.build_dir }}",
            "-G", "Visual Studio 17 2022",
            "-A", "${{ matrix.cmake_arch }}",
            "-DCMAKE_PREFIX_PATH=$qtRoot",
            "-DPython_EXECUTABLE=$python",
            "-DFLUENT_QT_PYSIDE6_REQUIRES_PYTHON=${{ matrix.requires_python }}",
            "-DFLUENT_QT_BUILD_PYSIDE6_BINDINGS=ON",
            "-DFLUENT_QT_BUILD_PYSIDE6_GALLERY=ON",
            "-DFLUENT_QT_BUILD_EXAMPLES=OFF",
            "-DFLUENT_QT_BUILD_GALLERY=OFF",
            "-DFLUENT_QT_BUILD_TESTS=OFF",
            "-DFLUENT_QT_INSTALL=OFF",
            "-DBUILD_TESTING=ON"
          )
          cmake @configureArgs

      - name: Build PySide6 bindings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --build "${{ matrix.build_dir }}" `
            --config Release `
            --target fluentqt_pyside6_stubs `
            --parallel "${{ matrix.build_parallel }}"

      - name: Verify generated binding contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $verifyArgs = @(
            "bindings/pyside6/tools/verify_generated_contracts.py",
            "--generated-dir",
            "${{ matrix.build_dir }}/bindings/pyside6/generated/_fluentqt"
          )
          if ("${{ matrix.check_backdrop_converter }}" -eq "true") {
            $verifyArgs += "--check-backdrop-converter"
          }
          python @verifyArgs

      - name: Test PySide6 bindings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          Remove-Item Env:LD_LIBRARY_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:DYLD_LIBRARY_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          ctest --test-dir "${{ matrix.build_dir }}" `
            -C Release `
            -L '^pyside$' `
            --output-on-failure `
            --no-tests=error

      - name: Build relocatable PySide6 wheels
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --build "${{ matrix.build_dir }}" `
            --config Release `
            --target fluentqt_pyside6_wheels `
            --parallel "${{ matrix.build_parallel }}"

      - name: Test wheel in a clean virtual environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          $wheels = @(
            Get-ChildItem `
              -Path "${{ matrix.build_dir }}/wheelhouse" `
              -Filter '*.whl' `
              -File
          )
          if ($wheels.Count -ne 1) {
            throw "Expected one FluentQt wheel, found $($wheels.Count)."
          }
          $wheel = $wheels[0]
          $expectedSuffix = "-${{ matrix.expected_wheel_suffix }}.whl"
          if (!$wheel.Name.EndsWith($expectedSuffix)) {
            throw "Unexpected wheel tag: $($wheel.Name); expected *$expectedSuffix"
          }
          $galleryWheels = @(
            Get-ChildItem `
              -Path "${{ matrix.build_dir }}/gallery-wheelhouse" `
              -Filter '*.whl' `
              -File
          )
          if ($galleryWheels.Count -ne 1) {
            throw "Expected one FluentQt Gallery wheel, found $($galleryWheels.Count)."
          }
          $galleryWheel = $galleryWheels[0]
          if (!$galleryWheel.Name.EndsWith("-py3-none-any.whl")) {
            throw "Unexpected Gallery wheel tag: $($galleryWheel.Name)"
          }

          $cleanVenv = Join-Path $env:RUNNER_TEMP "fluentqt-release-wheel-smoke"
          python -m venv $cleanVenv
          if ($IsWindows) {
            $cleanPython = Join-Path $cleanVenv "Scripts/python.exe"
          } else {
            $cleanPython = Join-Path $cleanVenv "bin/python"
          }
          & $cleanPython -m pip install $wheel.FullName $galleryWheel.FullName
          $wheelVersion = & $cleanPython -c 'from importlib.metadata import version; print(version("FluentQt"))'

          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          Remove-Item Env:LD_LIBRARY_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:DYLD_LIBRARY_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:FLUENTQT_EXPECTED_VERSION = $wheelVersion.Trim()
          & $cleanPython bindings/pyside6/tests/test_wheel_smoke.py
          & $cleanPython bindings/pyside6/gallery/tests/test_gallery_wheel_smoke.py
          & $cleanPython -m pip check

      - name: Run extended installed-wheel acceptance
        if: ${{ matrix.extended_acceptance == true }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          if ($IsWindows) {
            $cleanPython = Join-Path `
              $env:RUNNER_TEMP `
              "fluentqt-release-wheel-smoke/Scripts/python.exe"
          } else {
            $cleanPython = Join-Path `
              $env:RUNNER_TEMP `
              "fluentqt-release-wheel-smoke/bin/python"
          }
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          Remove-Item Env:LD_LIBRARY_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:DYLD_LIBRARY_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = "offscreen"
          & $cleanPython -m pip install mypy==2.3.0
          & $cleanPython -m mypy `
            --strict `
            --no-incremental `
            --no-error-summary `
            bindings/pyside6/tests/test_typecheck_smoke.py
          & $cleanPython `
            bindings/pyside6/examples/compatibility_showcase.py `
            --snapshot (Join-Path $env:RUNNER_TEMP "fluentqt-pyside6-showcase.png")
          & $cleanPython `
            bindings/pyside6/examples/auto_suggest_box.py `
            --snapshot (Join-Path $env:RUNNER_TEMP "fluentqt-pyside6-auto-suggest-box.png")
          & $cleanPython `
            bindings/pyside6/examples/guidance_overlays.py `
            --snapshot (Join-Path $env:RUNNER_TEMP "fluentqt-pyside6-guidance-overlays.png")
          & $cleanPython `
            bindings/pyside6/examples/command_surfaces.py `
            --snapshot (Join-Path $env:RUNNER_TEMP "fluentqt-pyside6-command-surfaces.png")

      - name: Audit Linux wheel runtime paths
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          clean_venv="${RUNNER_TEMP}/fluentqt-release-wheel-smoke"
          module="$(
            env -u PYTHONPATH "$clean_venv/bin/python" -c \
              'import fluentqt._fluentqt as native; print(native.__file__)'
          )"
          dynamic_section="$(readelf -d "$module")"
          printf '%s\n' "$dynamic_section"
          grep -F '$ORIGIN/../PySide6' <<< "$dynamic_section"
          if grep -F "$GITHUB_WORKSPACE" <<< "$dynamic_section"; then
            echo "::error::Installed wheel retained a build-tree RPATH."
            exit 1
          fi

          dependencies="$(env -u LD_LIBRARY_PATH ldd "$module")"
          printf '%s\n' "$dependencies"
          mapfile -t runtime_paths < <(
            awk \
              '$1 ~ /^(libQt6(Core|Gui|Widgets)\.so|libpyside6|libshiboken6)/ {print $3}' \
              <<< "$dependencies"
          )
          if (( ${#runtime_paths[@]} < 5 )); then
            echo "::error::Expected Qt, PySide6, and Shiboken6 dependencies."
            exit 1
          fi
          for runtime_path in "${runtime_paths[@]}"; do
            resolved_path="$(realpath "$runtime_path")"
            case "$resolved_path" in
              "$clean_venv"/*) ;;
              *)
                echo "::error::Wheel dependency resolved outside the clean venv: $resolved_path"
                exit 1
                ;;
            esac
          done

      - name: Build and audit publishable manylinux wheel
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        env:
          FLUENTQT_MANYLINUX_POLICY: ${{ matrix.manylinux_policy }}
          FLUENTQT_MANYLINUX_ARCH: ${{ matrix.binary_arch }}
          FLUENTQT_MANYLINUX_BUILD_DIR: ${{ matrix.manylinux_build_dir }}
          FLUENTQT_PYTHON_TAG: ${{ matrix.python_tag }}
          FLUENTQT_REQUIRES_PYTHON: ${{ matrix.requires_python }}
          FLUENTQT_PYSIDE_VERSION: ${{ matrix.pyside_version }}
          FLUENTQT_SHIBOKEN_VERSION: ${{ matrix.shiboken_version }}
          FLUENTQT_AUDITWHEEL_VERSION: ${{ matrix.auditwheel_version }}
          FLUENTQT_BUILD_PARALLEL: ${{ matrix.build_parallel }}
        run: |
          set -euo pipefail
          qt_root="$(realpath "$QT_ROOT_DIR")"
          host_uid="$(id -u)"
          host_gid="$(id -g)"
          docker pull "${{ matrix.manylinux_image }}"
          manylinux_image="$(
            docker image inspect \
              --format '{{index .RepoDigests 0}}' \
              "${{ matrix.manylinux_image }}"
          )"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --volume "$qt_root:/opt/fluentqt-qt:ro" \
            --workdir /work \
            --env FLUENTQT_MANYLINUX_POLICY \
            --env FLUENTQT_MANYLINUX_ARCH \
            --env FLUENTQT_MANYLINUX_BUILD_DIR \
            --env FLUENTQT_PYTHON_TAG \
            --env FLUENTQT_REQUIRES_PYTHON \
            --env FLUENTQT_QT_ROOT=/opt/fluentqt-qt \
            --env FLUENTQT_PYSIDE_VERSION \
            --env FLUENTQT_SHIBOKEN_VERSION \
            --env FLUENTQT_AUDITWHEEL_VERSION \
            --env FLUENTQT_BUILD_PARALLEL \
            --env "FLUENTQT_HOST_UID=$host_uid" \
            --env "FLUENTQT_HOST_GID=$host_gid" \
            "$manylinux_image" \
            bash /work/bindings/pyside6/tools/build_manylinux_wheel.sh

          wheelhouse="${{ matrix.manylinux_build_dir }}/manylinux-wheelhouse"
          mapfile -t wheels < <(
            find "$wheelhouse" -maxdepth 1 -type f -name '*.whl' -print
          )
          if (( ${#wheels[@]} != 1 )); then
            echo "::error::Expected one publishable manylinux wheel."
            exit 1
          fi
          expected_suffix="-${{ matrix.publish_wheel_suffix }}.whl"
          if [[ "${wheels[0]}" != *"$expected_suffix" ]]; then
            echo "::error::Unexpected publish wheel tag: ${wheels[0]}"
            exit 1
          fi
          report="${{ matrix.manylinux_build_dir }}/manylinux-audit.json"
          jq --arg image "$manylinux_image" \
            '. + {build_image: $image}' \
            "$report" > "$report.tmp"
          mv "$report.tmp" "$report"
          python -m json.tool "$report"

          clean_venv="${RUNNER_TEMP}/fluentqt-manylinux-wheel-smoke"
          python -m venv "$clean_venv"
          gallery_wheel="$(
            find "${{ matrix.build_dir }}/gallery-wheelhouse" \
              -maxdepth 1 -type f -name '*.whl' -print -quit
          )"
          if [[ -z "$gallery_wheel" ]]; then
            echo "::error::The FluentQt Gallery wheel was not generated."
            exit 1
          fi
          "$clean_venv/bin/python" -m pip install \
            "${wheels[0]}" \
            "$gallery_wheel"
          wheel_version="$(
            "$clean_venv/bin/python" -c \
              'from importlib.metadata import version; print(version("FluentQt"))'
          )"
          env \
            -u PYTHONPATH \
            -u LD_LIBRARY_PATH \
            -u QT_PLUGIN_PATH \
            -u QT_QPA_PLATFORM_PLUGIN_PATH \
            QT_QPA_PLATFORM=offscreen \
            FLUENTQT_EXPECTED_VERSION="$wheel_version" \
            "$clean_venv/bin/python" \
            bindings/pyside6/tests/test_wheel_smoke.py
          env \
            -u PYTHONPATH \
            -u LD_LIBRARY_PATH \
            -u QT_PLUGIN_PATH \
            -u QT_QPA_PLATFORM_PLUGIN_PATH \
            QT_QPA_PLATFORM=offscreen \
            FLUENTQT_EXPECTED_VERSION="$wheel_version" \
            "$clean_venv/bin/python" \
            bindings/pyside6/gallery/tests/test_gallery_wheel_smoke.py
          "$clean_venv/bin/python" -m pip check
          if [[ "${{ matrix.extended_acceptance }}" == "true" ]]; then
            "$clean_venv/bin/python" -m pip install mypy==2.3.0
            env -u PYTHONPATH \
              "$clean_venv/bin/python" -m mypy \
              --strict \
              --no-incremental \
              --no-error-summary \
              bindings/pyside6/tests/test_typecheck_smoke.py
          fi

          module="$(
            env -u PYTHONPATH "$clean_venv/bin/python" -c \
              'import fluentqt._fluentqt as native; print(native.__file__)'
          )"
          dependencies="$(env -u LD_LIBRARY_PATH ldd "$module")"
          printf '%s\n' "$dependencies"
          if grep -F 'not found' <<< "$dependencies"; then
            echo "::error::The manylinux wheel has an unresolved dependency."
            exit 1
          fi

      - name: Audit macOS wheel runtime paths and architecture
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          clean_venv="${RUNNER_TEMP}/fluentqt-release-wheel-smoke"
          module="$(
            env -u PYTHONPATH "$clean_venv/bin/python" -c \
              'import fluentqt._fluentqt as native; print(native.__file__)'
          )"
          rpaths="$(
            otool -l "$module" \
              | awk '/cmd LC_RPATH/ {getline; getline; print $2}'
          )"
          printf '%s\n' "$rpaths"
          grep -Fx '@loader_path/../PySide6' <<< "$rpaths"
          grep -Fx '@loader_path/../shiboken6' <<< "$rpaths"
          grep -Fx '@loader_path/../PySide6/Qt/lib' <<< "$rpaths"
          if grep -E '^/' <<< "$rpaths"; then
            echo "::error::Installed wheel retained an absolute RPATH."
            exit 1
          fi

          dependencies="$(otool -L "$module")"
          printf '%s\n' "$dependencies"
          architecture="$(lipo -archs "$module")"
          if [[ "$architecture" != "${{ matrix.binary_arch }}" ]]; then
            echo "::error::Expected ${{ matrix.binary_arch }} extension, found: $architecture"
            exit 1
          fi
          deployment_target="$(
            otool -l "$module" \
              | awk '
                  /cmd LC_BUILD_VERSION/ { in_build_version = 1; next }
                  in_build_version && $1 == "minos" { print $2; exit }
                '
          )"
          if [[ "$deployment_target" != "${{ matrix.macos_deployment_target }}" ]]; then
            echo "::error::Expected macOS deployment target ${{ matrix.macos_deployment_target }}, found: $deployment_target"
            exit 1
          fi

      - name: Verify native X11 Window and TitleBar
        if: ${{ runner.os == 'Linux' && matrix.extended_acceptance == true }}
        shell: bash
        run: |
          set -euo pipefail
          clean_venv="${RUNNER_TEMP}/fluentqt-release-wheel-smoke"
          xvfb-run -a env \
            -u PYTHONPATH \
            -u LD_LIBRARY_PATH \
            -u QT_PLUGIN_PATH \
            -u QT_QPA_PLATFORM_PLUGIN_PATH \
            QT_QPA_PLATFORM=xcb \
            "$clean_venv/bin/python" \
            bindings/pyside6/examples/window_chrome.py \
            --verify-native \
            --snapshot "$RUNNER_TEMP/fluentqt-pyside6-window-chrome.png" \
            --report "$RUNNER_TEMP/fluentqt-pyside6-window-chrome.json"

      - name: Verify native Windows Window and TitleBar
        if: ${{ runner.os == 'Windows' && matrix.extended_acceptance == true }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $cleanPython = Join-Path `
            $env:RUNNER_TEMP `
            "fluentqt-release-wheel-smoke/Scripts/python.exe"
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = "windows"
          & $cleanPython `
            bindings/pyside6/examples/window_chrome.py `
            --verify-native `
            --snapshot (Join-Path $env:RUNNER_TEMP "fluentqt-pyside6-window-chrome.png") `
            --report (Join-Path $env:RUNNER_TEMP "fluentqt-pyside6-window-chrome.json")

      - name: Verify native Cocoa Window and TitleBar
        if: ${{ runner.os == 'macOS' && matrix.extended_acceptance == true }}
        shell: bash
        run: |
          set -euo pipefail
          clean_venv="${RUNNER_TEMP}/fluentqt-release-wheel-smoke"
          env \
            -u PYTHONPATH \
            -u DYLD_LIBRARY_PATH \
            -u QT_PLUGIN_PATH \
            -u QT_QPA_PLATFORM_PLUGIN_PATH \
            QT_QPA_PLATFORM=cocoa \
            "$clean_venv/bin/python" \
            bindings/pyside6/examples/window_chrome.py \
            --verify-native \
            --snapshot "$RUNNER_TEMP/fluentqt-pyside6-window-chrome.png" \
            --report "$RUNNER_TEMP/fluentqt-pyside6-window-chrome.json"

      - name: Upload PySide6 release wheel
        if: ${{ runner.os != 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: fluentqt-pyside6-${{ matrix.artifact_suffix }}
          path: |
            ${{ matrix.build_dir }}/wheelhouse/*.whl
            ${{ matrix.build_dir }}/gallery-wheelhouse/*.whl
          if-no-files-found: error

      - name: Upload PySide6 manylinux release wheel and audit
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: fluentqt-pyside6-${{ matrix.artifact_suffix }}
          path: |
            ${{ matrix.manylinux_build_dir }}/manylinux-wheelhouse/*.whl
            ${{ matrix.manylinux_build_dir }}/manylinux-audit.json
            ${{ matrix.build_dir }}/gallery-wheelhouse/*.whl
          if-no-files-found: error

      - name: Upload PySide6 release acceptance snapshot
        if: ${{ matrix.extended_acceptance == true }}
        uses: actions/upload-artifact@v4
        with:
          name: fluentqt-pyside6-showcase-${{ matrix.artifact_suffix }}
          path: ${{ runner.temp }}/fluentqt-pyside6-showcase.png
          if-no-files-found: error

      - name: Upload PySide6 release native window acceptance
        if: ${{ matrix.extended_acceptance == true }}
        uses: actions/upload-artifact@v4
        with:
          name: fluentqt-pyside6-window-chrome-${{ matrix.artifact_suffix }}
          path: |
            ${{ runner.temp }}/fluentqt-pyside6-window-chrome.png
            ${{ runner.temp }}/fluentqt-pyside6-window-chrome.json
          if-no-files-found: error

  pyside6_release_bundle:
    name: Assemble canonical Python release bundle
    needs:
      - plan
      - pyside6_release
    if: >-
      ${{
        always() &&
        needs.plan.outputs.mode == 'full' &&
        inputs.build_release_bundle &&
        needs.pyside6_release.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download release-wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fluentqt-pyside6-qt693-*
          path: ${{ runner.temp }}/fluentqt-python-release-input
          merge-multiple: false

      - name: Assemble and verify release bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/assemble-pyside-release-bundle.py \
            --input "${RUNNER_TEMP}/fluentqt-python-release-input" \
            --output "${RUNNER_TEMP}/fluentqt-python-release-bundle"
          jq -e \
            '.schema_version == 1 and
             .policy.core_wheel_count == 17 and
             .policy.gallery_wheel_count == 1 and
             .policy.manylinux_audit_count == 5 and
             (.files | length) == 18 and
             (.audits | length) == 5' \
            "${RUNNER_TEMP}/fluentqt-python-release-bundle/python-release-manifest.json"
          (
            cd "${RUNNER_TEMP}/fluentqt-python-release-bundle"
            sha256sum --check PYTHON_SHA256SUMS.txt
          )

      - name: Validate PyPI Markdown rendering
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install twine==7.0.0
          python3 -m twine check \
            "${RUNNER_TEMP}/fluentqt-python-release-bundle/dist/"*.whl

      - name: Summarize release bundle
        shell: bash
        run: |
          manifest_sha="$(
            sha256sum \
              "${RUNNER_TEMP}/fluentqt-python-release-bundle/python-release-manifest.json" \
              | awk '{print $1}'
          )"
          {
            echo "## Python release bundle"
            echo ""
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Core wheels: 17"
            echo "- Gallery wheels: 1"
            echo "- manylinux audits: 5"
            echo "- Manifest SHA-256: $manifest_sha"
            echo ""
            echo '```text'
            sed 's#  dist/#  #' \
              "${RUNNER_TEMP}/fluentqt-python-release-bundle/PYTHON_SHA256SUMS.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload canonical Python release bundle
        uses: actions/upload-artifact@v4
        with:
          name: fluentqt-python-release-bundle
          path: ${{ runner.temp }}/fluentqt-python-release-bundle
          if-no-files-found: error
          retention-days: 30

  pyside6_platform_summary:
    name: Verify Python candidate platform coverage
    needs:
      - plan
      - pyside6_linux
      - pyside6_windows
      - pyside6_macos
      - pyside6_release
    if: ${{ always() && needs.plan.outputs.mode == 'full' && inputs.build_release_bundle }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read current-attempt evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --paginate \
            --jq '.artifacts[].name' \
            > "${RUNNER_TEMP}/artifact-names.txt"
          sort -u "${RUNNER_TEMP}/artifact-names.txt" \
            -o "${RUNNER_TEMP}/artifact-names.txt"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            --paginate \
            --jq '.jobs[] | [.name, .conclusion] | @tsv' \
            > "${RUNNER_TEMP}/job-results.tsv"

      - name: Verify every release platform
        shell: bash
        run: |
          set -euo pipefail
          verification_scope="all"
          if [[ "${{ inputs.run_compatibility_validation }}" != "true" ]]; then
            verification_scope="release"
          fi
          while IFS='|' read -r display_name platform arch; do
            python3 .github/scripts/verify-pyside-platform-artifacts.py \
              --platform "$platform" \
              --arch "$arch" \
              --display-name "$display_name" \
              --artifacts "${RUNNER_TEMP}/artifact-names.txt" \
              --jobs "${RUNNER_TEMP}/job-results.tsv" \
              --scope "$verification_scope"
          done <<'PLATFORMS'
          Linux x64|linux|x64
          Linux ARM64|linux|arm64
          Windows x64|windows|x64
          Windows ARM64|windows|arm64
          macOS x64|macos|x64
          macOS ARM64|macos|arm64
          PLATFORMS
