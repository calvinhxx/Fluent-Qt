name: C++ CI module

on:
  workflow_call:
    inputs:
      mode:
        description: Validation tier selected by the CI orchestrator.
        required: true
        type: string
      candidate_owns_windows_arm64:
        description: The release candidate builds and verifies this commit's Windows ARM64 installer.
        type: boolean
        default: false
      cpp_test_scope:
        description: Pull-request C++ test scope (none, selected, or all).
        required: false
        default: none
        type: string
      cpp_test_label_regex:
        description: Trusted CTest label regex selected by the orchestrator.
        required: false
        default: ""
        type: string
      cpp_test_targets:
        description: Trusted space-separated CMake test targets selected by the orchestrator.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  plan:
    name: Plan C++ validation
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      mode: ${{ steps.matrix.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2

      - name: Install C++ formatter
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv-format
          .venv-format/bin/python -m pip install --disable-pip-version-check clang-format==22.1.8

      - name: Validate C++ CI catalogs
        shell: bash
        run: |
          python3 .github/scripts/test_validate_ci_cpp_matrix.py
          python3 .github/scripts/validate-package-matrix.py
          python3 .github/scripts/validate-project-metadata.py
          python3 tools/quality/test_check_cpp_format.py
          python3 tools/quality/validate_component_api.py --project-root . --self-test
          python3 tools/quality/validate_visual_evidence_inventory.py --project-root . --self-test

      - name: Check changed C++ formatting
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(
            git diff --name-only --diff-filter=ACMR "$PR_BASE_SHA...HEAD" --
          )"
          if grep -Eiq '\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$' <<< "$changed_files"; then
            python3 tools/quality/check_cpp_format.py --changed-from "$PR_BASE_SHA"
          else
            echo "No changed C++ files require formatting checks."
          fi

      - name: Select C++ validation matrix
        id: matrix
        env:
          VALIDATION_MODE: ${{ inputs.mode }}
          CPP_TEST_SCOPE: ${{ inputs.cpp_test_scope }}
          CPP_TEST_LABEL_REGEX: ${{ inputs.cpp_test_label_regex }}
          CPP_TEST_TARGETS: ${{ inputs.cpp_test_targets }}
          CANDIDATE_OWNS_WINDOWS_ARM64: ${{ inputs.candidate_owns_windows_arm64 }}
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(python3 .github/scripts/select_ci_cpp_matrix.py)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "mode=$VALIDATION_MODE" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      # Allow the longer macOS and Windows jobs to start alongside Linux.
      max-parallel: 10
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Smoke adaptive build parallelism
        shell: pwsh
        run: |
          $python = if ("${{ runner.os }}" -eq "Windows") { "python" } else { "python3" }
          $selectedText = (& $python tools/dev/fluent_qt_build.py --print-jobs | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Adaptive build resource detection failed."
          }
          $selectedJobs = 0
          if (-not [int]::TryParse($selectedText, [ref]$selectedJobs) -or $selectedJobs -lt 1) {
            throw "Adaptive build returned an invalid job count: '$selectedText'."
          }
          Write-Host "Adaptive build selected $selectedJobs job(s) on ${{ runner.os }} ${{ runner.arch }}."
          & $python tools/dev/fluent_qt_build.py `
            --jobs auto `
            --dry-run `
            --preset "${{ matrix.preset }}" `
            --target FluentQt
          if ($LASTEXITCODE -ne 0) {
            throw "Adaptive build dry-run failed."
          }

      - name: Verify native ARM64 runner
        if: ${{ matrix.native_arm64 == true }}
        shell: pwsh
        run: |
          if ("${{ runner.arch }}" -ne "ARM64") {
            throw "Expected an ARM64 runner, got '${{ runner.arch }}'."
          }

      - name: Prepare vcpkg binary cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Cache vcpkg binary packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.vcpkg_triplet }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.vcpkg_triplet }}-
            vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux system packages
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: bash .github/scripts/install-linux-dependencies.sh "${{ matrix.qt_source }}"

      - name: Install QmlBridge Linux dependencies
        if: ${{ runner.os == 'Linux' && matrix.qt_source == 'apt' && contains(matrix.configure_args, '-DFLUENT_QT_BUILD_QML_BRIDGE=ON') }}
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends \
            qt6-base-private-dev \
            qt6-declarative-dev \
            qt6-declarative-private-dev \
            qml6-module-qtquick \
            qml6-module-qtqml \
            qml6-module-qtqml-models \
            qml6-module-qtqml-workerscript

      # matrix.compiler_cache names the full lane that owns the snapshot. Fast
      # PR lanes reuse an identically configured full lane because only the
      # full tier runs on main.
      - name: Select compiler cache key
        id: compiler_cache_key
        if: ${{ matrix.compiler_cache != '' }}
        continue-on-error: true
        shell: bash
        env:
          CACHE_LANE: ${{ matrix.compiler_cache }}
          CACHE_QT_VERSION: ${{ matrix.qt_version }}
        run: |
          compiler="$(c++ --version 2>/dev/null | head -n 1 || true)"
          compiler_id="$(printf '%s' "$compiler" | shasum -a 256 | cut -c 1-12)"
          echo "Compiler cache identity: ${compiler:-unknown} ($compiler_id)"
          prefix="fluentqt-ccache-v2-$CACHE_LANE-$RUNNER_OS-$RUNNER_ARCH-qt$CACHE_QT_VERSION-$compiler_id-"
          {
            echo "prefix=$prefix"
            echo "key=$prefix$(date -u '+%G-%V')"
          } >> "$GITHUB_OUTPUT"

      - name: Restore compiler cache
        id: compiler_cache
        if: ${{ steps.compiler_cache_key.outputs.key != '' }}
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.compiler_cache_key.outputs.key }}
          restore-keys: ${{ steps.compiler_cache_key.outputs.prefix }}

      # Hosted runners use the same absolute workspace path for every run. No
      # base_dir is set: it would pass relative paths to the compiler, and
      # tests resolve repository files from __FILE__.
      - name: Enable compiler cache
        if: ${{ steps.compiler_cache.outcome == 'success' }}
        shell: bash
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_MAXSIZE: ${{ matrix.compiler_cache_max_size }}
          CCACHE_NOHASHDIR: "1"
          CCACHE_COMPRESSLEVEL: "5"
        run: |
          if ! command -v ccache >/dev/null; then
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              install=(env HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install ccache)
            else
              install=(sudo apt-get install -y --no-install-recommends ccache)
            fi
            if ! "${install[@]}"; then
              echo "::warning::ccache is unavailable. Compiling normally."
              exit 0
            fi
          fi
          if ! mkdir -p "$CCACHE_DIR" || ! ccache --zero-stats; then
            echo "::warning::Could not initialize ccache. Compiling normally."
            exit 0
          fi
          {
            echo "CCACHE_DIR=$CCACHE_DIR"
            echo "CCACHE_MAXSIZE=$CCACHE_MAXSIZE"
            echo "CCACHE_NOHASHDIR=$CCACHE_NOHASHDIR"
            echo "CCACHE_COMPRESSLEVEL=$CCACHE_COMPRESSLEVEL"
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          } >> "$GITHUB_ENV"

      # ccache's Homebrew fmt dependency must not shadow vcpkg's headers.
      # Keep its keg for ccache's runtime, but remove the global prefix links.
      # Run even after an optional cache-install failure that installed fmt.
      - name: Isolate Homebrew fmt from vcpkg
        if: ${{ runner.os == 'macOS' && matrix.compiler_cache != '' }}
        shell: bash
        run: |
          if brew list --versions fmt >/dev/null 2>&1; then
            brew unlink fmt
          fi

      - name: Install NSIS for Windows packaging
        if: ${{ matrix.windows_package == true }}
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Install host Qt ${{ matrix.qt_version }}
        if: ${{ matrix.qt_source == 'aqt' && matrix.windows_arm64_cross == true }}
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.host_qt_arch }}
          cache: true

      - name: Remember host Qt path
        if: ${{ matrix.windows_arm64_cross == true }}
        shell: pwsh
        run: |
          $qtHostPath = $env:QT_ROOT_DIR -replace '\\', '/'
          "QT_HOST_PATH=$qtHostPath" >> $env:GITHUB_ENV

      - name: Install Qt ${{ matrix.qt_version }}
        if: ${{ matrix.qt_source == 'aqt' && matrix.qt_archives == '' && matrix.windows_arm64_native != true }}
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Install native Windows ARM64 Qt ${{ matrix.qt_version }}
        if: ${{ matrix.qt_source == 'aqt' && matrix.windows_arm64_native == true }}
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ matrix.qt_version }}
          host: windows_arm64
          arch: ${{ matrix.qt_arch }}
          cache: true
          setup-python: false

      - name: Install Qt ${{ matrix.qt_version }} archives
        if: ${{ matrix.qt_source == 'aqt' && matrix.qt_archives != '' }}
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_arch }}
          archives: ${{ matrix.qt_archives }}
          cache: true

      - name: Configure Linux Qt runtime path
        if: ${{ runner.os == 'Linux' && matrix.qt_source == 'aqt' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${QT_ROOT_DIR:-}" ]]; then
            echo "LD_LIBRARY_PATH=${QT_ROOT_DIR}/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
            echo "QT_PLUGIN_PATH=${QT_ROOT_DIR}/plugins" >> "$GITHUB_ENV"
            echo "QT_QPA_PLATFORM_PLUGIN_PATH=${QT_ROOT_DIR}/plugins/platforms" >> "$GITHUB_ENV"
          fi

      - name: Set VCPKG_ROOT
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is not set on this runner."
          }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Configure
        if: ${{ matrix.windows_arm64_cross != true }}
        shell: pwsh
        run: |
          $configureArgs = @("--preset", "${{ matrix.preset }}")
          if ($env:QT_ROOT_DIR) {
            $qtRoot = $env:QT_ROOT_DIR -replace '\\', '/'
            $configureArgs += @("-D", "CMAKE_PREFIX_PATH=$qtRoot")
          }
          $extraArgs = "${{ matrix.configure_args }}"
          if ($extraArgs) {
            $configureArgs += $extraArgs -split " "
          }
          cmake @configureArgs

      - name: Configure Windows ARM64 cross-build
        if: ${{ matrix.windows_arm64_cross == true }}
        shell: pwsh
        run: |
          $qtRoot = $env:QT_ROOT_DIR -replace '\\', '/'
          $qtHost = $env:QT_HOST_PATH -replace '\\', '/'
          $configureArgs = @("--preset", "${{ matrix.preset }}", "-D", "CMAKE_PREFIX_PATH=$qtRoot", "-D", "QT_HOST_PATH=$qtHost")
          $extraArgs = "${{ matrix.configure_args }}"
          if ($extraArgs) {
            $configureArgs += $extraArgs -split " "
          }
          cmake @configureArgs

      - name: Validate generated Linux desktop entry
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: desktop-file-validate build/${{ matrix.preset }}/app/*.desktop

      - name: Build
        if: ${{ matrix.build == true }}
        shell: pwsh
        env:
          QT_QPA_PLATFORM: ${{ matrix.qt_qpa_platform || 'offscreen' }}
          SKIP_VISUAL_TEST: 1
          ASAN_OPTIONS: ${{ matrix.asan_options || '' }}
          UBSAN_OPTIONS: ${{ matrix.ubsan_options || '' }}
        run: |
          $python = if ("${{ runner.os }}" -eq "Windows") { "python" } else { "python3" }
          $buildArgs = @("--preset", "${{ matrix.preset }}")
          $buildTargets = "${{ matrix.build_targets }}"
          if ($buildTargets) {
            $buildArgs += "--target"
            $buildArgs += $buildTargets -split " "
          }
          # An empty matrix value selects CPU- and memory-bounded jobs. A bare
          # --parallel lets Makefile builds start every compiler at once.
          $jobs = "${{ matrix.build_parallel }}"
          if (-not $jobs) { $jobs = "auto" }
          $launcher = $python
          $prefixArgs = @()
          if ("${{ matrix.id }}" -eq "mac-x64-qt62-gallery") {
            /usr/sbin/sysctl machdep.cpu.brand_string hw.logicalcpu vm.loadavg
            $launcher = "/usr/bin/time"
            $prefixArgs = @("-l", $python)
          }
          & $launcher @prefixArgs tools/dev/fluent_qt_build.py --jobs $jobs @buildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify relocatable macOS CMake package
        if: ${{ matrix.verify_relocatable_sdk == true }}
        shell: bash
        run: |
          set -euo pipefail

          original_prefix="$RUNNER_TEMP/fluentqt-original"
          relocated_prefix="$RUNNER_TEMP/fluentqt-relocated"
          consumer_build="$RUNNER_TEMP/fluentqt-relocated-consumer"

          cmake --install "build/${{ matrix.preset }}" \
            --config Debug \
            --component Development \
            --prefix "$original_prefix"

          package_dir="$original_prefix/lib/cmake/FluentQt"
          test -f "$package_dir/FluentQtApplePlatformDependencies.cmake"
          if grep -R -F \
            -e "$GITHUB_WORKSPACE" \
            -e "$RUNNER_TEMP" \
            -e "$QT_ROOT_DIR" \
            -e "/Applications/Xcode.app" \
            "$package_dir"; then
            echo "::error::Build-machine path leaked into the FluentQt CMake package."
            exit 1
          fi
          if grep -R -E 'MacOSX[^/]*\.sdk' "$package_dir"; then
            echo "::error::Apple SDK path leaked into the FluentQt CMake package."
            exit 1
          fi

          mv "$original_prefix" "$relocated_prefix"
          cmake \
            -S .github/integration \
            -B "$consumer_build" \
            -DFLUENT_QT_INTEGRATION_MODE=INSTALLED \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$relocated_prefix;$QT_ROOT_DIR"
          cmake --build "$consumer_build" --parallel 4

      - name: Smoke launch native Windows ARM64 Gallery
        if: ${{ matrix.windows_arm64_native == true && matrix.gallery_smoke == true }}
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          SKIP_VISUAL_TEST: 1
        run: |
          $gallery = Get-ChildItem -Path "build/${{ matrix.preset }}/app" -Recurse -Filter fluent_qt_gallery.exe |
            Select-Object -First 1
          if (-not $gallery) {
            throw "The Windows ARM64 Gallery executable was not found."
          }

          $process = $null
          try {
            $process = Start-Process -FilePath $gallery.FullName -PassThru
            Start-Sleep -Seconds 5
            if ($process.HasExited) {
              throw "The Windows ARM64 Gallery exited during smoke launch with code $($process.ExitCode)."
            }
          } finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Smoke launch native Linux ARM64 Gallery with X11
        if: ${{ matrix.linux_xcb_smoke == true }}
        shell: bash
        env:
          QT_QPA_PLATFORM: xcb
          SKIP_VISUAL_TEST: 1
        run: |
          set -euo pipefail
          gallery="build/${{ matrix.preset }}/app/fluent_qt_gallery"
          if [[ ! -x "$gallery" ]]; then
            echo "::error::The Linux ARM64 Gallery executable was not found: $gallery"
            exit 1
          fi

          xvfb-run -a sh -c '
            "$1" &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            sleep 5
            kill -0 "$pid"
          ' sh "$gallery"

      - name: Test
        if: ${{ matrix.build == true && matrix.test == true }}
        shell: pwsh
        env:
          QT_QPA_PLATFORM: ${{ matrix.qt_qpa_platform || 'offscreen' }}
          SKIP_VISUAL_TEST: 1
          FLUENT_QT_SPATIAL_EVIDENCE: ${{ github.workspace }}/build/${{ matrix.preset }}/Testing/SpatialEvidence
          ASAN_OPTIONS: ${{ matrix.asan_options || '' }}
          UBSAN_OPTIONS: ${{ matrix.ubsan_options || '' }}
        run: |
          # The catalog keeps ctest_parallel at 1 unless the lane's isolation is
          # proven; shared Gallery settings probes carry a CTest RESOURCE_LOCK.
          $testArgs = @(
            "--preset", "${{ matrix.preset }}",
            "--output-on-failure",
            "--timeout", "${{ matrix.ctest_timeout }}",
            "--parallel", "${{ matrix.ctest_parallel }}",
            "--no-tests=error"
          )
          $testLabels = "${{ matrix.test_labels }}"
          $excludeLabels = "${{ matrix.exclude_labels }}"
          if ($testLabels) {
            $testArgs += @("-L", $testLabels)
          }
          if ($excludeLabels) {
            $testArgs += @("-LE", $excludeLabels)
          }
          ctest @testArgs

      - name: Configure Linux Gallery package
        if: ${{ matrix.package == true }}
        shell: bash
        run: cmake --preset "${{ matrix.package_build_preset }}"

      - name: Build Linux Gallery package
        if: ${{ matrix.package == true }}
        shell: bash
        run: cmake --build --preset "${{ matrix.package_build_preset }}" --target fluent_qt_gallery --parallel 4

      - name: Package Linux Gallery
        if: ${{ matrix.package == true }}
        shell: bash
        run: cpack --preset "${{ matrix.package_preset }}"

      - name: Verify Linux Gallery package metadata
        if: ${{ matrix.package == true }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(build/${{ matrix.package_build_preset }}/*.deb)
          if (( ${#packages[@]} != 1 )); then
            echo "::error::Expected exactly one DEB package, found ${#packages[@]}."
            exit 1
          fi

          dpkg-deb --field "${packages[0]}" Architecture Depends Recommends
          depends="$(dpkg-deb --field "${packages[0]}" Depends)"
          if [[ "$depends" != *qt6-qpa-plugins* ]]; then
            echo "::error::The DEB package does not depend on qt6-qpa-plugins."
            exit 1
          fi

      - name: Upload Linux Gallery package
        if: ${{ matrix.package == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fluent-qt-gallery-linux-${{ matrix.package_arch }}-deb
          retention-days: 14
          path: |
            build/${{ matrix.package_build_preset }}/*.deb
          if-no-files-found: error

      - name: Package Windows ARM64 Gallery
        if: ${{ matrix.windows_package == true }}
        shell: pwsh
        run: |
          # Keep CPack's NSIS staging tree short. Qt's nested runtime paths can
          # otherwise exceed the legacy path limit used by makensis.
          $packageOutput = Join-Path $env:RUNNER_TEMP "fq-win-arm64"
          & cpack --preset "${{ matrix.package_preset }}" -B $packageOutput
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Get-ChildItem -LiteralPath $packageOutput -Filter NSISOutput.log -Recurse `
              -ErrorAction SilentlyContinue |
              ForEach-Object { Get-Content -LiteralPath $_.FullName }
            exit $exitCode
          }

          $stagedGallery = Get-ChildItem `
            -LiteralPath (Join-Path $packageOutput "_CPack_Packages") `
            -Filter fluent_qt_gallery.exe -File -Recurse |
            Where-Object { $_.Directory.Name -eq "bin" } |
            Select-Object -First 1
          if (-not $stagedGallery) {
            throw "The staged Windows ARM64 Gallery executable was not found."
          }
          & "$env:GITHUB_WORKSPACE/cmake/VerifyWindowsPeArchitecture.ps1" `
            -Root $stagedGallery.Directory.FullName `
            -ExpectedMachine Arm64 `
            -RequireMsvcRuntime `
            -RequireQt6SpatialRuntime

      - name: Upload Windows ARM64 Gallery installer
        if: ${{ matrix.windows_package == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fluent-qt-gallery-windows-arm64-installer
          retention-days: 14
          path: |
            ${{ runner.temp }}/fq-win-arm64/*.exe
          if-no-files-found: error

      - name: Record installed C++ first-window trial
        if: ${{ matrix.first_window_trial == true }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          # Time an uncached application build, as a new user would see it.
          Remove-Item Env:CMAKE_C_COMPILER_LAUNCHER, Env:CMAKE_CXX_COMPILER_LAUNCHER `
            -ErrorAction SilentlyContinue
          $installPrefix = Join-Path `
            $env:RUNNER_TEMP `
            "fluentqt-first-window-install"
          cmake --install "build/${{ matrix.preset }}" `
            --config Debug `
            --component Development `
            --prefix $installPrefix

          $prefixParts = @(($installPrefix -replace '\\', '/'))
          if ($env:QT_ROOT_DIR) {
            $prefixParts += ($env:QT_ROOT_DIR -replace '\\', '/')
          }
          $prefixPath = $prefixParts -join ";"
          $launcher = Join-Path `
            $installPrefix `
            "share/doc/FluentQt/tools/onboarding/fluentqt"
          $report = Join-Path `
            $env:RUNNER_TEMP `
            "fluentqt-first-window-cpp.json"
          $parallel = "${{ matrix.build_parallel }}"
          if (-not $parallel) {
            $parallel = "4"
          }

          python $launcher trial `
            --profile cpp `
            --starter workbench `
            --cmake-prefix-path $prefixPath `
            --config Debug `
            --parallel $parallel `
            --timeout-seconds 600 `
            --output $report

      - name: Upload C++ first-window report
        if: ${{ always() && matrix.first_window_trial == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fluentqt-first-window-${{ needs.plan.outputs.mode }}-${{ matrix.id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fluentqt-first-window-cpp.json
          if-no-files-found: warn
          retention-days: 14

      - name: Report compiler cache usage
        if: ${{ !cancelled() && env.CCACHE_DIR != '' }}
        continue-on-error: true
        shell: bash
        run: ccache --show-stats --verbose

      # Only the owner lane writes, once per ISO week, from a successful main run.
      - name: Save compiler cache
        if: >-
          ${{ success() && env.CCACHE_DIR != '' && steps.compiler_cache.outputs.cache-hit != 'true' &&
              matrix.compiler_cache == matrix.id &&
              github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.compiler_cache_key.outputs.key }}

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-${{ needs.plan.outputs.mode }}-${{ matrix.id }}-diagnostics-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/${{ matrix.preset }}/CMakeCache.txt
            build/${{ matrix.preset }}/CMakeFiles/CMakeConfigureLog.yaml
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
            build/${{ matrix.preset }}/Testing/Temporary/LastTestsFailed.log
            build/${{ matrix.preset }}/Testing/SpatialEvidence/
            build/${{ matrix.preset }}/vcpkg-manifest-install.log
            build/${{ matrix.package_build_preset }}/CMakeCache.txt
            build/${{ matrix.package_build_preset }}/_CPack_Packages/**/*.log
            ${{ runner.temp }}/fq-win-arm64/_CPack_Packages/**/*.log
            build/${{ matrix.preset }}/vcpkg_installed/vcpkg/issue_body.md

  integration:
    name: Library integration ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Qt 5.15
            qt_source: apt5
          - name: Qt 6.2
            qt_source: apt6
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Qt and build tools
        shell: bash
        run: bash .github/scripts/install-linux-dependencies.sh "${{ matrix.qt_source }}"

      - name: Configure external source-subproject integration
        shell: bash
        run: |
          cmake -S .github/integration -B build/integration-source \
            -DFLUENT_QT_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt6OpenGL=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt6OpenGLWidgets=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_spdlog=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_GTest=TRUE

      - name: Build external source-subproject integration
        shell: bash
        run: cmake --build build/integration-source --parallel 4

      - name: Configure FetchContent integration
        shell: bash
        run: |
          cmake -S .github/integration -B build/integration-fetchcontent \
            -DFLUENT_QT_INTEGRATION_MODE=FETCHCONTENT \
            -DFLUENT_QT_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt6OpenGL=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt6OpenGLWidgets=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_spdlog=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_GTest=TRUE

      - name: Build FetchContent integration
        shell: bash
        run: cmake --build build/integration-fetchcontent --parallel 4

      - name: Install FluentQt development component
        shell: bash
        run: |
          cmake --install build/integration-source \
            --config Release \
            --component Development \
            --prefix "$RUNNER_TEMP/fluentqt"

      - name: Verify installed onboarding command
        shell: bash
        run: |
          command="$RUNNER_TEMP/fluentqt/share/doc/FluentQt/tools/onboarding/fluentqt"
          test -x "$command"
          "$command" --help

      - name: Verify library-only CMake package
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/fluentqt/lib/cmake/FluentQt"
          test -f "$package_dir/FluentQtConfig.cmake"
          test -f "$package_dir/FluentQtTargets.cmake"
          test ! -f "$package_dir/FluentQtSpatialTargets.cmake"
          test ! -f "$RUNNER_TEMP/fluentqt/include/FluentQt/Spatial.h"
          test ! -f "$package_dir/FluentQtParticlesTargets.cmake"
          test ! -f "$RUNNER_TEMP/fluentqt/include/FluentQt/Particles.h"
          test -f "$RUNNER_TEMP/fluentqt/include/FluentQt/Diagnostics.h"
          test -f "$RUNNER_TEMP/fluentqt/include/FluentQt/utils/Inspector.h"
          if grep -R -E 'spdlog|fmt::|GTest|FluentQtLoggingSupport|support/logging' "$package_dir"; then
            echo "::error::Gallery or test dependencies leaked into the FluentQt package."
            exit 1
          fi
          for header in \
            components/foundation/private/FluentElement_p.h \
            compatibility/private/WindowBackdropEvents_p.h \
            utils/private/Inspector_p.h \
            utils/private/FluentQtLogging_p.h \
            utils/private/FluentQtResources_p.h; do
            if [[ -e "$RUNNER_TEMP/fluentqt/include/FluentQt/$header" ]]; then
              echo "::error::Internal header leaked into the FluentQt package: $header"
              exit 1
            fi
          done

      - name: Configure installed-package integration
        shell: bash
        run: |
          cmake -S .github/integration -B build/integration-installed \
            -DFLUENT_QT_INTEGRATION_MODE=INSTALLED \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/fluentqt" \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt6OpenGL=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt6OpenGLWidgets=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_spdlog=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_GTest=TRUE

      - name: Build installed-package integration
        shell: bash
        run: cmake --build build/integration-installed --parallel 4

      - name: Build and install optional Spatial and Particles components
        shell: bash
        run: |
          cmake -S .github/integration -B build/integration-source \
            -DFLUENT_QT_INTEGRATION_SPATIAL=ON \
            -DFLUENT_QT_INTEGRATION_PARTICLES=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt6OpenGL=FALSE \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt6OpenGLWidgets=FALSE
          cmake --build build/integration-source --parallel 4
          cmake --install build/integration-source \
            --config Release --component Development \
            --prefix "$RUNNER_TEMP/fluentqt-optional"

      - name: Verify separate base, Spatial and Particles package consumers
        shell: bash
        run: |
          cmake -S .github/integration -B build/integration-installed-base \
            -DFLUENT_QT_INTEGRATION_MODE=INSTALLED \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/fluentqt-optional" \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt6OpenGL=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt6OpenGLWidgets=TRUE
          cmake --build build/integration-installed-base --parallel 4
          cmake -S .github/integration -B build/integration-installed-spatial \
            -DFLUENT_QT_INTEGRATION_MODE=INSTALLED \
            -DFLUENT_QT_INTEGRATION_SPATIAL=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/fluentqt-optional"
          cmake --build build/integration-installed-spatial --parallel 4
          cmake -S .github/integration -B build/integration-installed-particles \
            -DFLUENT_QT_INTEGRATION_MODE=INSTALLED \
            -DFLUENT_QT_INTEGRATION_PARTICLES=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/fluentqt-optional" \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt6OpenGL=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt6OpenGLWidgets=TRUE
          cmake --build build/integration-installed-particles --parallel 4
          QT_QPA_PLATFORM=offscreen build/integration-installed-base/fluentqt_external_integration
          QT_QPA_PLATFORM=offscreen build/integration-installed-spatial/fluentqt_external_integration
          QT_QPA_PLATFORM=offscreen build/integration-installed-particles/fluentqt_external_integration

      - name: Verify FluentQt library source package
        if: ${{ matrix.qt_source == 'apt6' }}
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/source-package"
          cmake \
            -D "FLUENT_QT_SOURCE_DIR=$GITHUB_WORKSPACE" \
            -D "FLUENT_QT_SOURCE_PACKAGE_DIR=$output" \
            -D "FLUENT_QT_SOURCE_PACKAGE_VERSION=ci" \
            -P cmake/CreateSourcePackage.cmake
          archive="$output/FluentQt-ci-source.zip"
          test -f "$archive"
          # The native Python binding builds the shared texture host and the
          # Gallery interface-zoom backend from source. Keep only those support
          # subtrees; Gallery, tests and logging stay out.
          if unzip -Z1 "$archive" | grep -E '^[^/]+/(app|tests|support)/' | \
              grep -Ev '^[^/]+/support/((spatial|interfacezoom)(/.*)?)?$'; then
            echo "::error::Non-library files leaked into the FluentQt source package."
            exit 1
          fi
          if unzip -Z1 "$archive" | grep -E \
              '^[^/]+/bindings/pyside6/gallery/'; then
            echo "::error::The standalone Python Gallery leaked into the library source package."
            exit 1
          fi
          archive_entries="$(unzip -Z1 "$archive")"
          for source_file in \
              uilib/CMakeLists.txt \
              plugin/CMakeLists.txt \
              plugin/plugin_extension/CMakeLists.txt \
              plugin/Spatial/CMakeLists.txt \
              plugin/QmlBridge/CMakeLists.txt \
              cmake/FluentQtPlugins.cmake \
              cmake/FluentQtRuntime.cmake \
              cmake/FluentQtSpatial.cmake \
              cmake/FluentQtInterfaceZoom.cmake \
              cmake/FluentQtQmlBridge.cmake \
              cmake/FluentQtHelloWorldExamples.cmake \
              cmake/FluentQtPluginExtensionExample.cmake \
              cmake/FluentQtQmlBridgeExample.cmake \
              examples/hello_world/CMakeLists.txt \
              examples/plugin_extension/CMakeLists.txt \
              examples/qml_bridge/CMakeLists.txt \
              support/spatial/SpatialTextureHost.cpp \
              support/spatial/SpatialTextureHost.h \
              support/spatial/shaders/spatial_rhi.qrc \
              support/spatial/shaders/panel.vert.qsb \
              support/spatial/shaders/panel.frag.qsb \
              support/interfacezoom/InterfaceZoom.cpp \
              support/interfacezoom/InterfaceZoom.h \
              .agents/skills/build-fluentqt-gui/SKILL.md \
              .agents/skills/build-fluentqt-gui/LICENSE.txt \
              .agents/skills/build-fluentqt-gui/agents/openai.yaml \
              .agents/skills/build-fluentqt-gui/assets/benchmarks/agent-run.schema.json \
              .agents/skills/build-fluentqt-gui/assets/benchmarks/agent-run-workspace.json \
              .agents/skills/build-fluentqt-gui/assets/composition-recipes.json \
              .agents/skills/build-fluentqt-gui/assets/fluentqt-ai-catalog.json \
              .agents/skills/build-fluentqt-gui/assets/project-structure-templates.json \
              .agents/skills/build-fluentqt-gui/references/art-direction.md \
              .agents/skills/build-fluentqt-gui/references/component-selection.md \
              .agents/skills/build-fluentqt-gui/references/cross-agent-benchmark.md \
              .agents/skills/build-fluentqt-gui/references/design-intelligence.md \
              .agents/skills/build-fluentqt-gui/references/experience-differentiation.md \
              .agents/skills/build-fluentqt-gui/references/fluentqt-maintainer-gates.md \
              .agents/skills/build-fluentqt-gui/references/iconography.md \
