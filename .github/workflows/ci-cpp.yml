              docs/ai/evals/scenarios.json \
              docs/ai/evals/scenarios.schema.json \
              docs/ai/fluentqt-ai-catalog.schema.json \
              docs/ai/generated/fluentqt-ai-catalog.json \
              docs/ai/guidance.json \
              docs/ai/project-analysis.schema.json \
              include/FluentQt/Diagnostics.h \
              llms.txt \
              src/utils/Inspector.h \
              tools/ai/evaluate_ai_catalog.py \
              tools/ai/package_fluentqt_skill.py \
              tools/ai/query_ai_catalog.py \
              tools/onboarding/README.md \
              tools/onboarding/create-report.schema.json \
              tools/onboarding/doctor-report.schema.json \
              tools/onboarding/first-window-report.schema.json \
              tools/onboarding/fluentqt \
              tools/onboarding/fluentqt_create.py \
              tools/onboarding/fluentqt_doctor.py \
              tools/onboarding/fluentqt_trial.py \
              tools/onboarding/qt_widgets_probe/CMakeLists.txt \
              tools/onboarding/starters/manifest.json \
