              tools/onboarding/test_fluentqt_doctor.py \
              tools/onboarding/test_fluentqt_trial.py \
              tools/fonts/fluent_icon_aliases.json; do
            if ! grep -x "FluentQt-ci-source/$source_file" \
                <<< "$archive_entries" > /dev/null; then
              echo "::error::Missing source-package file: $source_file"
              exit 1
            fi
          done
          unzip -q "$archive" -d "$output/unpacked"
          test -x \
            "$output/unpacked/FluentQt-ci-source/tools/onboarding/fluentqt"
          python3 \
            "$output/unpacked/FluentQt-ci-source/tools/ai/query_ai_catalog.py" \
            --component tree-view > /dev/null
          python3 \
            "$output/unpacked/FluentQt-ci-source/tools/ai/package_fluentqt_skill.py" \
            --project-root "$output/unpacked/FluentQt-ci-source" \
            --output-dir "$output/skill-dist" \
            --version ci > /dev/null
          skill_archive="$output/skill-dist/build-fluentqt-gui-ci.zip"
          test -f "$skill_archive"
          unzip -q "$skill_archive" -d "$output/skill-installed"
          python3 \
            "$output/skill-installed/build-fluentqt-gui/scripts/query_catalog.py" \
            --component field > /dev/null
          python3 \
            "$output/unpacked/FluentQt-ci-source/tools/ai/evaluate_ai_catalog.py" \
            --project-root "$output/unpacked/FluentQt-ci-source"
          python3 \
            "$output/unpacked/FluentQt-ci-source/tools/onboarding/test_fluentqt_doctor.py"
          python3 \
            "$output/unpacked/FluentQt-ci-source/tools/onboarding/test_fluentqt_create.py"
          python3 \
            "$output/unpacked/FluentQt-ci-source/tools/onboarding/test_fluentqt_trial.py"
          cmake -S .github/integration -B build/integration-source-package \
            -DFLUENT_QT_SOURCE_DIR="$output/unpacked/FluentQt-ci-source" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_DISABLE_FIND_PACKAGE_spdlog=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_GTest=TRUE
          cmake --build build/integration-source-package --parallel 4

      - name: Record installed C++ first-window trial
        shell: bash
        run: |
          set -euo pipefail
          command="$RUNNER_TEMP/fluentqt/share/doc/FluentQt/tools/onboarding/fluentqt"
          "$command" trial \
            --profile cpp \
            --starter workbench \
            --cmake-prefix-path "$RUNNER_TEMP/fluentqt" \
            --config Release \
            --parallel 4 \
            --timeout-seconds 600 \
            --output "$RUNNER_TEMP/fluentqt-first-window-integration.json"

      - name: Upload integration first-window report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fluentqt-first-window-integration-${{ matrix.qt_source }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fluentqt-first-window-integration.json
          if-no-files-found: warn
          retention-days: 14
