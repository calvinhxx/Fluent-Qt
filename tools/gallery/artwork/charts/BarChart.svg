<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <title>BarChart</title>
  <defs>
    <linearGradient id="tile" x1="3" y1="3" x2="65" y2="69" gradientUnits="userSpaceOnUse">
      <stop stop-color="#005fb8" />
      <stop offset="1" stop-color="#005fb8" />
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" />
      <stop offset="1" stop-color="#dde0e8" />
    </linearGradient>
    <linearGradient id="purpleSurface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f5e5ff" />
      <stop offset="1" stop-color="#cba8eb" />
    </linearGradient>
    <radialGradient id="sphere" cx="0.35" cy="0.3" r="0.75">
      <stop stop-color="#fff" />
      <stop offset="0.45" stop-color="#eeeef5" />
      <stop offset="1" stop-color="#9397a6" />
    </radialGradient>
  </defs>
  <g id="artwork">
    <rect x="3" y="3" width="66" height="66" rx="16" fill="#005fb8" opacity="1" />
    <rect x="20" y="36" width="6" height="18" rx="2" fill="white" opacity="1" />
    <rect x="30" y="25" width="6" height="29" rx="2" fill="white" opacity="1" />
    <rect x="40" y="31" width="6" height="23" rx="2" fill="white" opacity="1" />
    <rect x="50" y="16" width="6" height="38" rx="2" fill="white" opacity="1" />
  </g>
</svg>
