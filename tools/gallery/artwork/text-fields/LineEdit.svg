<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <title>LineEdit</title>
  <defs>
    <linearGradient id="tile" x1="3" y1="3" x2="65" y2="69" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2db5e7" />
      <stop offset="1" stop-color="#0d4688" />
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" />
      <stop offset="1" stop-color="#dde0e8" />
    </linearGradient>
    <linearGradient id="purpleSurface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f5e5ff" />
      <stop offset="1" stop-color="#cba8eb" />
    </linearGradient>
    <radialGradient id="sphere" cx="0.35" cy="0.3" r="0.75">
      <stop stop-color="#fff" />
      <stop offset="0.45" stop-color="#eeeef5" />
      <stop offset="1" stop-color="#9397a6" />
    </radialGradient>
  </defs>
  <g id="artwork">
    <rect x="3" y="3" width="66" height="66" rx="6" fill="url(#tile)" opacity="1" />
    <rect x="11.5" y="28" width="52" height="18" rx="1" fill="#12343f" opacity="0.22" />
    <rect x="10" y="26" width="52" height="18" rx="1" fill="white" opacity="1" />
    <polyline points="15,37 29,37" fill="none" stroke="#468ccc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1" />
    <polyline points="35,31 35,40" fill="none" stroke="#15547a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="1" />
  </g>
</svg>
