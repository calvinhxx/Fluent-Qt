<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <title>InfoBar</title>
  <defs>
    <linearGradient id="tile" x1="3" y1="3" x2="65" y2="69" gradientUnits="userSpaceOnUse">
      <stop stop-color="#33d7d3" />
      <stop offset="1" stop-color="#007e8f" />
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" />
      <stop offset="1" stop-color="#dde0e8" />
    </linearGradient>
    <linearGradient id="purpleSurface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f5e5ff" />
      <stop offset="1" stop-color="#cba8eb" />
    </linearGradient>
    <radialGradient id="sphere" cx="0.35" cy="0.3" r="0.75">
      <stop stop-color="#fff" />
      <stop offset="0.45" stop-color="#eeeef5" />
      <stop offset="1" stop-color="#9397a6" />
    </radialGradient>
  </defs>
  <g id="artwork">
    <rect x="3" y="3" width="66" height="66" rx="4" fill="url(#tile)" opacity="1" />
    <circle cx="27" cy="34" r="17" fill="#046a72" opacity="0.6" />
    <rect x="24" y="22" width="6" height="16" rx="3" fill="url(#surface)" opacity="1" />
    <circle cx="27" cy="46" r="3" fill="url(#sphere)" opacity="1" />
  </g>
</svg>
