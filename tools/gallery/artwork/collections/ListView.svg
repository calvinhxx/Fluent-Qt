    <circle cx="16" cy="20" r="4" fill="url(#sphere)" opacity="1" />
    <rect x="25" y="18" width="29" height="5" rx="2" fill="url(#surface)" opacity="1" />
    <circle cx="16" cy="36" r="4" fill="url(#sphere)" opacity="1" />
    <rect x="25" y="34" width="38" height="5" rx="2" fill="url(#surface)" opacity="1" />
    <circle cx="16" cy="52" r="4" fill="url(#sphere)" opacity="1" />
    <rect x="25" y="50" width="34" height="5" rx="2" fill="url(#surface)" opacity="1" />
