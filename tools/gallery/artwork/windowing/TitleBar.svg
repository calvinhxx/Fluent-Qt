    <rect x="11" y="12" width="50" height="14" rx="1" fill="#b896e4" opacity="1" />
    <rect x="11" y="26" width="50" height="26" rx="1" fill="url(#purpleSurface)" opacity="1" />
    <polyline points="41,17 46,17" fill="none" stroke="white" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1" />
    <rect x="50" y="15" width="5" height="5" rx="0" fill="none" opacity="1" stroke="white" stroke-width="1" />
    <polyline points="58,15 63,20" fill="none" stroke="white" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1" />
    <polyline points="63,15 58,20" fill="none" stroke="white" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1" />
  </g>
</svg>
